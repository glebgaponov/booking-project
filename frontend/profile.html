cat > frontend/profile.html << 'EOF'
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOW | Личный кабинет</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #faf6f5; color: #1a1a2e; }
        .header { background: linear-gradient(135deg, #2d1b4e 0%, #4a2c6d 50%, #c77d9e 100%); color: white; padding: 20px 0; position: sticky; top: 0; z-index: 100; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        .header-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .logo { font-size: 28px; font-weight: 700; background: linear-gradient(135deg, #fff, #f0c0d0); -webkit-background-clip: text; background-clip: text; color: transparent; text-decoration: none; }
        .nav-links { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
        .nav-link { color: white; text-decoration: none; font-weight: 500; cursor: pointer; transition: opacity 0.2s; }
        .nav-link:hover { opacity: 0.8; }
        .logout-btn { background: rgba(255,255,255,0.2); border: none; padding: 6px 16px; border-radius: 40px; color: white; cursor: pointer; }
        .profile-container { max-width: 1000px; margin: 40px auto; background: white; border-radius: 32px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .profile-header { background: linear-gradient(135deg, #2d1b4e, #4a2c6d); padding: 40px; color: white; text-align: center; }
        .avatar { width: 100px; height: 100px; background: #c77d9e; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 48px; margin: 0 auto 16px; }
        .profile-name { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .profile-role { opacity: 0.8; }
        .tabs { display: flex; border-bottom: 1px solid #f0e0e5; background: white; }
        .tab { flex: 1; padding: 16px; text-align: center; cursor: pointer; font-weight: 600; color: #888; transition: all 0.2s; }
        .tab.active { color: #2d1b4e; border-bottom: 2px solid #c77d9e; }
        .tab-content { display: none; padding: 32px; }
        .tab-content.active { display: block; }
        .booking-card { background: #faf6f5; border-radius: 20px; padding: 20px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .booking-info h4 { margin-bottom: 8px; }
        .booking-status { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-active { background: #e0f2e7; color: #16a34a; }
        .status-completed { background: #e2e8f0; color: #64748b; }
        .status-cancelled { background: #fee2e2; color: #dc2626; }
        .cancel-btn { background: #fee2e2; border: none; padding: 8px 16px; border-radius: 40px; color: #dc2626; cursor: pointer; font-size: 14px; }
        .edit-form { background: #faf6f5; border-radius: 20px; padding: 24px; margin-top: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-group input { width: 100%; padding: 12px 16px; border: 1px solid #e2d0d8; border-radius: 16px; outline: none; }
        .btn-save { background: linear-gradient(135deg, #c77d9e, #a85a7a); border: none; padding: 12px 24px; border-radius: 40px; color: white; font-weight: 600; cursor: pointer; }
        .favorite-card { background: #faf6f5; border-radius: 20px; padding: 20px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .favorite-remove { background: none; border: none; color: #dc2626; cursor: pointer; font-size: 20px; }
        @media (max-width: 768px) { .booking-card { flex-direction: column; text-align: center; } }
    </style>
</head>
<body>

<header class="header">
    <div class="container">
        <div class="header-content">
            <a href="/" class="logo">GLOW</a>
            <div class="nav-links">
                <a href="/" class="nav-link">Главная</a>
                <a href="/profile.html" class="nav-link">Личный кабинет</a>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>
        </div>
    </div>
</header>

<div class="profile-container">
    <div class="profile-header">
        <div class="avatar" id="userAvatar">👤</div>
        <div class="profile-name" id="userFullName">Загрузка...</div>
        <div class="profile-role" id="userRole"></div>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="bookings">Мои записи</div>
        <div class="tab" data-tab="favorites">Избранное</div>
        <div class="tab" data-tab="settings">Настройки</div>
        <div class="tab" data-tab="reviews">Отзывы</div>
    </div>

    <!-- Вкладка "Мои записи" -->
    <div id="bookings-tab" class="tab-content active">
        <div id="bookingsList"></div>
    </div>

    <!-- Вкладка "Избранное" -->
    <div id="favorites-tab" class="tab-content">
        <div id="favoritesList"></div>
    </div>

    <!-- Вкладка "Настройки" -->
    <div id="settings-tab" class="tab-content">
        <div class="edit-form">
            <h3 style="margin-bottom:20px">Редактировать профиль</h3>
            <div class="form-group"><label>Имя и фамилия</label><input type="text" id="editFullName"></div>
            <div class="form-group"><label>Телефон</label><input type="tel" id="editPhone"></div>
            <div class="form-group"><label>Email</label><input type="email" id="editEmail"></div>
            <button class="btn-save" onclick="saveProfile()">Сохранить изменения</button>
        </div>
    </div>

    <!-- Вкладка "Отзывы" -->
    <div id="reviews-tab" class="tab-content">
        <div id="reviewsList"></div>
        <div class="edit-form" style="margin-top:20px">
            <h3 style="margin-bottom:20px">Оставить отзыв</h3>
            <div class="form-group"><label>Мастер</label><select id="reviewMasterId" class="form-group" style="width:100%; padding:12px"></select></div>
            <div class="form-group"><label>Оценка</label><select id="reviewRating"><option value="5">5 ★</option><option value="4">4 ★</option><option value="3">3 ★</option><option value="2">2 ★</option><option value="1">1 ★</option></select></div>
            <div class="form-group"><label>Текст отзыва</label><textarea id="reviewText" rows="3" style="width:100%; padding:12px; border-radius:16px; border:1px solid #e2d0d8"></textarea></div>
            <button class="btn-save" onclick="addReview()">Оставить отзыв</button>
        </div>
    </div>
</div>

<script>
    let currentUser = JSON.parse(localStorage.getItem('glow_current_user'));
    let users = JSON.parse(localStorage.getItem('glow_users')) || [];
    let bookings = JSON.parse(localStorage.getItem('glow_bookings')) || [];
    let favorites = JSON.parse(localStorage.getItem('glow_favorites')) || [];
    let reviews = JSON.parse(localStorage.getItem('glow_reviews')) || [];
    
    const mockMasters = [
        { id: 1, name: "Анна Соловьёва", category: "Макияж", price: 4500 },
        { id: 2, name: "Елена Морозова", category: "Маникюр", price: 2500 },
        { id: 3, name: "Мария Волкова", category: "Брови", price: 1800 },
        { id: 4, name: "Ольга Новикова", category: "Волосы", price: 3500 },
        { id: 5, name: "Татьяна Белова", category: "Макияж", price: 4000 },
        { id: 6, name: "Ирина Соколова", category: "Уход", price: 3000 }
    ];

    if (!currentUser) window.location.href = '/auth.html';

    function updateProfileHeader() {
        document.getElementById('userFullName').innerText = currentUser.fullName || currentUser.email;
        document.getElementById('userRole').innerText = currentUser.role === 'client' ? 'Клиент' : (currentUser.role === 'master' ? 'Мастер' : 'Администратор');
        document.getElementById('editFullName').value = currentUser.fullName || '';
        document.getElementById('editPhone').value = currentUser.phone || '';
        document.getElementById('editEmail').value = currentUser.email || '';
    }

    function renderBookings() {
        const userBookings = bookings.filter(b => b.userId === currentUser.id);
        if (userBookings.length === 0) {
            document.getElementById('bookingsList').innerHTML = '<p style="text-align:center; color:#888">У вас пока нет записей</p>';
            return;
        }
        document.getElementById('bookingsList').innerHTML = userBookings.map(b => `
            <div class="booking-card">
                <div class="booking-info">
                    <h4>${b.masterName}</h4>
                    <p>${b.date} ${b.time || ''}</p>
                    <p>${b.totalCost.toLocaleString()} ₽</p>
                </div>
                <div>
                    <span class="booking-status status-${b.status === 'Активна' ? 'active' : 'completed'}">${b.status}</span>
                    ${b.status === 'Активна' ? `<button class="cancel-btn" onclick="cancelBooking(${b.id})">Отменить</button>` : ''}
                </div>
            </div>
        `).join('');
    }

    function cancelBooking(id) {
        bookings = bookings.filter(b => b.id !== id);
        localStorage.setItem('glow_bookings', JSON.stringify(bookings));
        renderBookings();
    }

    function renderFavorites() {
        const favoriteMasters = mockMasters.filter(m => favorites.includes(m.id));
        if (favoriteMasters.length === 0) {
            document.getElementById('favoritesList').innerHTML = '<p style="text-align:center; color:#888">У вас пока нет избранных мастеров</p>';
            return;
        }
        document.getElementById('favoritesList').innerHTML = favoriteMasters.map(m => `
            <div class="favorite-card">
                <div><strong>${m.name}</strong><br>${m.category} • ${m.price} ₽</div>
                <button class="favorite-remove" onclick="removeFavorite(${m.id})">✕</button>
            </div>
        `).join('');
    }

    function removeFavorite(masterId) {
        favorites = favorites.filter(id => id !== masterId);
        localStorage.setItem('glow_favorites', JSON.stringify(favorites));
        renderFavorites();
    }

    function saveProfile() {
        const fullName = document.getElementById('editFullName').value;
        const phone = document.getElementById('editPhone').value;
        const email = document.getElementById('editEmail').value;
        
        currentUser.fullName = fullName;
        currentUser.phone = phone;
        currentUser.email = email;
        
        const userIndex = users.findIndex(u => u.id === currentUser.id);
        if (userIndex !== -1) {
            users[userIndex] = { ...users[userIndex], fullName, phone, email };
            localStorage.setItem('glow_users', JSON.stringify(users));
        }
        
        localStorage.setItem('glow_current_user', JSON.stringify(currentUser));
        updateProfileHeader();
        alert('Профиль обновлён!');
    }

    function renderReviews() {
        const userReviews = reviews.filter(r => r.userId === currentUser.id);
        const reviewsHtml = userReviews.map(r => {
            const master = mockMasters.find(m => m.id === r.masterId);
            return `<div class="booking-card"><div><strong>${master?.name}</strong><br>Оценка: ${r.rating} ★<br>${r.text}</div></div>`;
        }).join('');
        document.getElementById('reviewsList').innerHTML = reviewsHtml || '<p style="text-align:center; color:#888">У вас пока нет отзывов</p>';
        
        const masterSelect = document.getElementById('reviewMasterId');
        masterSelect.innerHTML = '<option value="">Выберите мастера</option>' + 
            mockMasters.map(m => `<option value="${m.id}">${m.name} (${m.category})</option>`).join('');
    }

    function addReview() {
        const masterId = parseInt(document.getElementById('reviewMasterId').value);
        const rating = parseInt(document.getElementById('reviewRating').value);
        const text = document.getElementById('reviewText').value;
        
        if (!masterId) { alert('Выберите мастера'); return; }
        if (!text) { alert('Введите текст отзыва'); return; }
        
        reviews.push({ id: Date.now(), userId: currentUser.id, masterId, rating, text });
        localStorage.setItem('glow_reviews', JSON.stringify(reviews));
        document.getElementById('reviewText').value = '';
        renderReviews();
        alert('Отзыв добавлен!');
    }

    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`${tab.dataset.tab}-tab`).classList.add('active');
            if (tab.dataset.tab === 'favorites') renderFavorites();
            if (tab.dataset.tab === 'reviews') renderReviews();
        });
    });

    function logout() {
        localStorage.removeItem('glow_current_user');
        window.location.href = '/';
    }

    updateProfileHeader();
    renderBookings();
    renderFavorites();
</script>
</body>
</html>
EOF
