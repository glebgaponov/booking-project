<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход / Регистрация | GLOW</title>
<meta name="description" content="Войдите или зарегистрируйтесь на GLOW Beauty Platform">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0a1e;--bg2:#1a1030;--card:#1e1535;--border:rgba(255,255,255,.08);--text:#f0eaff;--muted:rgba(240,234,255,.6);--accent:#b06ab3;--accent2:#4776e6;--radius:16px;--input-bg:rgba(255,255,255,.05)}
[data-theme="light"]{--bg:#faf8ff;--bg2:#f0ebff;--card:#fff;--border:rgba(0,0,0,.08);--text:#1a1030;--muted:rgba(26,16,48,.6);--input-bg:rgba(0,0,0,.03)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem;transition:background .3s,color .3s}
body::before{content:'';position:fixed;width:500px;height:500px;background:radial-gradient(circle,rgba(176,106,179,.2),transparent 70%);top:-100px;right:-100px;pointer-events:none}
body::after{content:'';position:fixed;width:400px;height:400px;background:radial-gradient(circle,rgba(71,118,230,.15),transparent 70%);bottom:-100px;left:-100px;pointer-events:none}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:2.5rem;width:100%;max-width:420px;position:relative;z-index:1;backdrop-filter:blur(10px)}
.logo{text-align:center;margin-bottom:2rem}
.logo a{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none}
.logo p{color:var(--muted);font-size:.9rem;margin-top:.25rem}
.tabs{display:flex;background:var(--bg2);border-radius:12px;padding:4px;margin-bottom:2rem;gap:4px}
.tab{flex:1;padding:.6rem;text-align:center;border-radius:9px;cursor:pointer;font-size:.9rem;font-weight:500;color:var(--muted);transition:all .2s;border:none;background:none}
.tab.active{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.form-group{margin-bottom:1.25rem}
label{display:block;font-size:.85rem;font-weight:500;margin-bottom:.5rem;color:var(--text);opacity:.8}
input,select{width:100%;padding:.85rem 1rem;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.95rem;font-family:'Inter',sans-serif;transition:border-color .2s,box-shadow .2s;outline:none}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(176,106,179,.15)}
input::placeholder{color:var(--muted)}
select option{background:var(--bg);color:var(--text)}
.password-wrap{position:relative}
.password-wrap input{padding-right:3rem}
.pw-toggle{position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:0}
.strength-bar{height:4px;border-radius:2px;margin-top:.5rem;background:var(--border);overflow:hidden;transition:all .3s}
.strength-fill{height:100%;width:0;border-radius:2px;transition:width .3s,background .3s}
.strength-text{font-size:.75rem;margin-top:.25rem;color:var(--muted)}
.btn{width:100%;padding:1rem;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 8px 25px rgba(176,106,179,.4);font-family:'Inter',sans-serif}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 35px rgba(176,106,179,.6)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.divider{text-align:center;color:var(--muted);font-size:.85rem;margin:1.25rem 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:var(--border)}
.divider::before{left:0}.divider::after{right:0}
.demo-btn{width:100%;padding:.85rem;background:var(--input-bg);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:.9rem;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}
.demo-btn:hover{border-color:var(--accent);background:rgba(176,106,179,.1)}
.toast{position:fixed;top:2rem;right:2rem;padding:1rem 1.5rem;border-radius:12px;font-size:.9rem;font-weight:500;z-index:9999;transform:translateX(120%);transition:transform .3s;max-width:320px}
.toast.show{transform:translateX(0)}
.toast.success{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#0a2e1a}
.toast.error{background:linear-gradient(135deg,#f5576c,#f093fb);color:#fff}
.back-link{text-align:center;margin-top:1.5rem}
.back-link a{color:var(--muted);text-decoration:none;font-size:.85rem;transition:color .2s}
.back-link a:hover{color:var(--text)}
.theme-toggle{position:fixed;top:1rem;right:1rem;background:var(--card);border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1.1rem;z-index:100}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>

<div class="auth-card">
  <div class="logo">
    <a href="/">✨ GLOW</a>
    <p>Платформа красоты</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')" id="tab-login">Войти</button>
    <button class="tab" onclick="switchTab('register')" id="tab-register">Регистрация</button>
  </div>

  <!-- Login Form -->
  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="your@email.com" required autocomplete="email">
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <div class="password-wrap">
        <input type="password" id="loginPassword" placeholder="Введите пароль" required autocomplete="current-password">
        <button type="button" class="pw-toggle" onclick="togglePw('loginPassword',this)">👁</button>
      </div>
    </div>
    <button type="submit" class="btn" id="loginBtn">Войти</button>
    <div class="divider">или</div>
    <button type="button" class="demo-btn" onclick="fillDemo('client')">🧪 Демо-клиент</button>
    <button type="button" class="demo-btn" style="margin-top:.5rem" onclick="fillDemo('admin')">🔑 Демо-админ</button>
  </form>

  <!-- Register Form -->
  <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
    <div class="form-group">
      <label>Имя</label>
      <input type="text" id="regName" placeholder="Ваше имя" required autocomplete="name">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="regEmail" placeholder="your@email.com" required autocomplete="email">
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <div class="password-wrap">
        <input type="password" id="regPassword" placeholder="Минимум 6 символов" required autocomplete="new-password" oninput="checkStrength(this.value)">
        <button type="button" class="pw-toggle" onclick="togglePw('regPassword',this)">👁</button>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <div class="strength-text" id="strengthText"></div>
    </div>
    <div class="form-group">
      <label>Роль</label>
      <select id="regRole">
        <option value="client">👤 Клиент — записываться к мастерам</option>
        <option value="master">💅 Мастер — принимать клиентов</option>
      </select>
    </div>
    <button type="submit" class="btn" id="registerBtn">Создать аккаунт</button>
  </form>

  <div class="back-link"><a href="/">← На главную</a></div>
</div>

<div class="toast" id="toast"></div>

<script>
function switchTab(tab){
  document.getElementById('loginForm').style.display=tab==='login'?'block':'none';
  document.getElementById('registerForm').style.display=tab==='register'?'block':'none';
  document.getElementById('tab-login').classList.toggle('active',tab==='login');
  document.getElementById('tab-register').classList.toggle('active',tab==='register');
}

function togglePw(id,btn){
  const inp=document.getElementById(id);
  const isText=inp.type==='text';
  inp.type=isText?'password':'text';
  btn.textContent=isText?'👁':'🙈';
}

function checkStrength(pw){
  const fill=document.getElementById('strengthFill');
  const text=document.getElementById('strengthText');
  let score=0;
  if(pw.length>=6)score++;
  if(pw.length>=10)score++;
  if(/[A-Z]/.test(pw))score++;
  if(/[0-9]/.test(pw))score++;
  if(/[^A-Za-z0-9]/.test(pw))score++;
  const levels=[
    {w:'0%',c:'transparent',t:''},
    {w:'25%',c:'#f5576c',t:'Слабый'},
    {w:'50%',c:'#fa709a',t:'Средний'},
    {w:'75%',c:'#f7971e',t:'Хороший'},
    {w:'100%',c:'#43e97b',t:'Сильный'}
  ];
  const l=levels[Math.min(score,4)];
  fill.style.width=l.w;fill.style.background=l.c;text.textContent=l.t;
}

function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className=`toast ${type}`;
  setTimeout(()=>t.classList.add('show'),10);
  setTimeout(()=>{t.classList.remove('show');},3500);
}

async function handleLogin(e){
  e.preventDefault();
  const btn=document.getElementById('loginBtn');
  const email=document.getElementById('loginEmail').value;
  const password=document.getElementById('loginPassword').value;
  btn.disabled=true;btn.textContent='⏳ Вход...';
  try{
    const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await res.json();
    if(res.ok){
      localStorage.setItem('glowToken',data.token);
      localStorage.setItem('glowUser',JSON.stringify(data.user));
      showToast('✅ Добро пожаловать, '+data.user.name+'!');
      setTimeout(()=>window.location.href='/',1200);
    }else{
      showToast(data.error||'Ошибка входа','error');
    }
  }catch{
    // Demo fallback
    const demos={
      'admin@glow.com':{id:1,email:'admin@glow.com',name:'Admin',role:'admin'},
      'client@glow.com':{id:2,email:'client@glow.com',name:'Демо Клиент',role:'client'}
    };
    const user=demos[email];
    if(user&&password==='admin123'){
      const fakeToken='demo_'+btoa(JSON.stringify(user));
      localStorage.setItem('glowToken',fakeToken);
      localStorage.setItem('glowUser',JSON.stringify(user));
      showToast('✅ Демо-режим: '+user.name);
      setTimeout(()=>window.location.href='/',1200);
    }else{
      showToast('Сервер недоступен. Используйте демо-аккаунт.','error');
    }
  }finally{
    btn.disabled=false;btn.textContent='Войти';
  }
}

async function handleRegister(e){
  e.preventDefault();
  const btn=document.getElementById('registerBtn');
  const name=document.getElementById('regName').value;
  const email=document.getElementById('regEmail').value;
  const password=document.getElementById('regPassword').value;
  const role=document.getElementById('regRole').value;
  if(password.length<6){showToast('Пароль минимум 6 символов','error');return;}
  btn.disabled=true;btn.textContent='⏳ Регистрация...';
  try{
    const res=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password,role})});
    const data=await res.json();
    if(res.ok){
      localStorage.setItem('glowToken',data.token);
      localStorage.setItem('glowUser',JSON.stringify(data.user));
      showToast('🎉 Аккаунт создан! Добро пожаловать!');
      setTimeout(()=>window.location.href='/',1200);
    }else{
      showToast(data.error||'Ошибка регистрации','error');
    }
  }catch{
    const user={id:Date.now(),email,name,role};
    const fakeToken='demo_'+btoa(JSON.stringify(user));
    localStorage.setItem('glowToken',fakeToken);
    localStorage.setItem('glowUser',JSON.stringify(user));
    showToast('🎉 Зарегистрированы (демо)!');
    setTimeout(()=>window.location.href='/',1200);
  }finally{
    btn.disabled=false;btn.textContent='Создать аккаунт';
  }
}

function fillDemo(type){
  if(type==='admin'){
    document.getElementById('loginEmail').value='admin@glow.com';
    document.getElementById('loginPassword').value='admin123';
  }else{
    document.getElementById('loginEmail').value='client@glow.com';
    document.getElementById('loginPassword').value='admin123';
  }
}

function toggleTheme(){
  const html=document.documentElement;
  const isDark=html.dataset.theme==='dark';
  html.dataset.theme=isDark?'light':'dark';
  document.getElementById('themeBtn').textContent=isDark?'☀️':'🌙';
  localStorage.setItem('theme',html.dataset.theme);
}
const saved=localStorage.getItem('theme');
if(saved){document.documentElement.dataset.theme=saved;document.getElementById('themeBtn').textContent=saved==='dark'?'🌙':'☀️';}

// Auto-redirect if already logged in
const token=localStorage.getItem('glowToken');
if(token)window.location.href='/';
</script>
</body>
</html>
