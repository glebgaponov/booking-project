<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOW | Вход и регистрация</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #2d1b4e 0%, #4a2c6d 50%, #c77d9e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-container { display: flex; max-width: 1000px; width: 100%; background: white; border-radius: 32px; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.2); }
        .auth-left { flex: 1; background: linear-gradient(135deg, #2d1b4e, #4a2c6d); padding: 48px; color: white; display: flex; flex-direction: column; justify-content: center; }
        .auth-left h2 { font-size: 32px; margin-bottom: 16px; font-weight: 700; }
        .auth-left p { opacity: 0.8; line-height: 1.5; margin-bottom: 32px; }
        .feature-list { list-style: none; }
        .feature-list li { margin-bottom: 16px; display: flex; align-items: center; gap: 12px; font-size: 15px; }
        .feature-list i { width: 24px; font-size: 18px; color: #c77d9e; }
        .auth-right { flex: 1; padding: 48px; overflow-y: auto; }
        .tabs { display: flex; gap: 24px; margin-bottom: 32px; border-bottom: 2px solid #f0e0e5; }
        .tab { font-size: 20px; font-weight: 600; padding-bottom: 12px; cursor: pointer; color: #888; transition: all 0.2s; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tab.active { color: #2d1b4e; border-bottom-color: #c77d9e; }
        .form-panel { display: none; }
        .form-panel.active { display: block; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #333; font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%; padding: 13px 16px; border: 1.5px solid #e2d0d8;
            border-radius: 14px; font-size: 15px; outline: none;
            transition: border-color 0.2s; font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus { border-color: #c77d9e; }
        .form-group input.error { border-color: #dc2626; }
        .input-hint { font-size: 12px; color: #999; margin-top: 4px; }
        .btn-submit {
            width: 100%; background: linear-gradient(135deg, #c77d9e, #a85a7a);
            border: none; padding: 14px; border-radius: 40px; color: white;
            font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px;
            transition: opacity 0.2s; font-family: inherit;
        }
        .btn-submit:hover { opacity: 0.9; }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #c77d9e; text-decoration: none; font-weight: 500; }
        .alert { padding: 12px 16px; border-radius: 12px; margin-bottom: 18px; font-size: 14px; display: none; }
        .alert-error { background: #fee2e2; color: #dc2626; }
        .alert-success { background: #e0f2e7; color: #16a34a; }
        .password-strength { height: 4px; border-radius: 2px; margin-top: 6px; transition: all 0.3s; }
        @media (max-width: 768px) { .auth-container { flex-direction: column; } .auth-left { padding: 32px; } }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-left">
        <h2>✨ GLOW</h2>
        <p>Платформа для поиска лучших бьюти-мастеров вашего города</p>
        <ul class="feature-list">
            <li><i class="fas fa-star"></i> Топ-мастера с проверенными отзывами</li>
            <li><i class="fas fa-tag"></i> Прозрачные цены без скрытых комиссий</li>
            <li><i class="fas fa-calendar-check"></i> Удобное онлайн-бронирование</li>
            <li><i class="fas fa-shield-alt"></i> Ваши данные надёжно защищены</li>
        </ul>
    </div>
    <div class="auth-right">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Вход</div>
            <div class="tab" onclick="switchTab('register')">Регистрация</div>
        </div>

        <div id="alertBox" class="alert"></div>

        <!-- Форма входа -->
        <div id="loginPanel" class="form-panel active">
            <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required placeholder="example@mail.ru">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit" id="loginBtn">Войти</button>
            </form>
            <div class="back-link"><a href="/">← На главную</a></div>
        </div>

        <!-- Форма регистрации -->
        <div id="registerPanel" class="form-panel">
            <form id="registerForm" onsubmit="handleRegister(event)" novalidate>
                <div class="form-group">
                    <label>Имя и фамилия</label>
                    <input type="text" id="regFullName" required placeholder="Анна Иванова">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" required placeholder="example@mail.ru">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="regPassword" required placeholder="минимум 6 символов"
                           oninput="checkPasswordStrength(this.value)">
                    <div class="password-strength" id="pwStrength"></div>
                    <div class="input-hint" id="pwHint"></div>
                </div>
                <div class="form-group">
                    <label>Подтверждение пароля</label>
                    <input type="password" id="regPasswordConfirm" required placeholder="повторите пароль">
                </div>
                <div class="form-group">
                    <label>Телефон <span style="color:#999">(необязательно)</span></label>
                    <input type="tel" id="regPhone" placeholder="+7 (999) 123-45-67">
                </div>
                <div class="form-group">
                    <label>Я регистрируюсь как</label>
                    <select id="regRole">
                        <option value="client">Клиент — ищу мастера</option>
                        <option value="master">Мастер — предоставляю услуги</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit" id="registerBtn">Зарегистрироваться</button>
            </form>
            <div class="back-link"><a href="/">← На главную</a></div>
        </div>
    </div>
</div>

<script>
    // ─── Утилиты ──────────────────────────────────────────────────────────────
    function showAlert(msg, type = 'error') {
        const box = document.getElementById('alertBox');
        box.className = `alert alert-${type}`;
        box.textContent = msg;
        box.style.display = 'block';
        setTimeout(() => box.style.display = 'none', 4000);
    }

    function setLoading(btnId, loading) {
        const btn = document.getElementById(btnId);
        btn.disabled = loading;
        btn.textContent = loading ? 'Загрузка...' : (btnId === 'loginBtn' ? 'Войти' : 'Зарегистрироваться');
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
        document.getElementById('alertBox').style.display = 'none';
        if (tab === 'login') {
            document.querySelector('.tab').classList.add('active');
            document.getElementById('loginPanel').classList.add('active');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('registerPanel').classList.add('active');
        }
    }

    function checkPasswordStrength(pw) {
        const bar = document.getElementById('pwStrength');
        const hint = document.getElementById('pwHint');
        if (!pw) { bar.style.width = '0'; bar.style.background = ''; hint.textContent = ''; return; }
        let score = 0;
        if (pw.length >= 6) score++;
        if (pw.length >= 10) score++;
        if (/[A-Z]/.test(pw)) score++;
        if (/[0-9]/.test(pw)) score++;
        if (/[^A-Za-z0-9]/.test(pw)) score++;
        const colors = ['#dc2626', '#f97316', '#eab308', '#22c55e', '#16a34a'];
        const labels = ['Очень слабый', 'Слабый', 'Средний', 'Хороший', 'Отличный'];
        bar.style.width = `${score * 20}%`;
        bar.style.background = colors[score - 1] || '#e5e7eb';
        hint.textContent = score > 0 ? labels[score - 1] : '';
    }

    // ─── Вход ─────────────────────────────────────────────────────────────────
    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!email || !password) { showAlert('Заполните все поля'); return; }

        setLoading('loginBtn', true);
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (!res.ok) { showAlert(data.error || 'Ошибка входа'); return; }

            // Сохраняем JWT-токен вместо пароля
            localStorage.setItem('glow_token', data.token);
            localStorage.setItem('glow_current_user', JSON.stringify(data.user));
            showAlert(`Добро пожаловать, ${data.user.fullName}!`, 'success');
            setTimeout(() => window.location.href = '/', 800);
        } catch {
            showAlert('Сервер недоступен. Попробуйте позже.');
        } finally {
            setLoading('loginBtn', false);
        }
    }

    // ─── Регистрация ──────────────────────────────────────────────────────────
    async function handleRegister(e) {
        e.preventDefault();
        const fullName = document.getElementById('regFullName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const passwordConfirm = document.getElementById('regPasswordConfirm').value;
        const phone = document.getElementById('regPhone').value.trim();
        const role = document.getElementById('regRole').value;

        if (!fullName || !email || !password) { showAlert('Заполните все обязательные поля'); return; }
        if (password.length < 6) { showAlert('Пароль должен содержать минимум 6 символов'); return; }
        if (password !== passwordConfirm) { showAlert('Пароли не совпадают'); return; }

        setLoading('registerBtn', true);
        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullName, email, password, phone, role })
            });
            const data = await res.json();
            if (!res.ok) { showAlert(data.error || 'Ошибка регистрации'); return; }

            localStorage.setItem('glow_token', data.token);
            localStorage.setItem('glow_current_user', JSON.stringify(data.user));
            showAlert('Регистрация прошла успешно!', 'success');
            setTimeout(() => window.location.href = '/', 800);
        } catch {
            showAlert('Сервер недоступен. Попробуйте позже.');
        } finally {
            setLoading('registerBtn', false);
        }
    }

    // Если уже авторизован — редирект
    if (localStorage.getItem('glow_token')) window.location.href = '/';
</script>
</body>
</html>
