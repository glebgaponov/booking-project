<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOW | Страница не найдена</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;
            background: linear-gradient(135deg, #2d1b4e 0%, #4a2c6d 50%, #c77d9e 100%); color: white; text-align: center; }
        .bubble { position: fixed; border-radius: 50%; opacity: 0.15; animation: float linear infinite; }
        @keyframes float { 0%{transform:translateY(110vh) scale(0)} 100%{transform:translateY(-20vh) scale(1)} }
        .content { position: relative; z-index: 10; padding: 40px; }
        .emoji { font-size: 80px; animation: bounce 1.5s ease-in-out infinite; display: block; margin-bottom: 24px; }
        @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-16px)} }
        h1 { font-size: clamp(80px, 15vw, 140px); font-weight: 800; letter-spacing: -4px; line-height: 1; opacity: 0.9; }
        h2 { font-size: clamp(20px, 4vw, 28px); font-weight: 700; margin: 12px 0 16px; }
        p { font-size: 16px; opacity: 0.8; margin-bottom: 32px; }
        .btn { display: inline-block; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4); color: white;
            padding: 14px 32px; border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 16px;
            transition: background 0.3s; }
        .btn:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
<script>
    const colors = ['#ffffff','#f0c0d0','#d4a0c0','#c0e0ff'];
    for (let i = 0; i < 8; i++) {
        const b = document.createElement('div');
        b.className = 'bubble';
        const size = Math.random() * 120 + 40;
        b.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${Math.random()*8+6}s;animation-delay:${Math.random()*4}s;`;
        document.body.appendChild(b);
    }
</script>
<div class="content">
    <span class="emoji">✨</span>
    <h1>404</h1>
    <h2>Страница не найдена</h2>
    <p>Кажется, эта страница исчезла, как тени от идеального контуринга</p>
    <a href="/" class="btn">← На главную</a>
</div>
</body>
</html>
