<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Страница не найдена | GLOW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0a1e;--bg2:#1a1030;--card:#1e1535;--border:rgba(255,255,255,.08);--text:#f0eaff;--muted:rgba(240,234,255,.6);--accent:#b06ab3;--accent2:#4776e6}
[data-theme="light"]{--bg:#faf8ff;--bg2:#f0ebff;--card:#fff;--border:rgba(0,0,0,.08);--text:#1a1030;--muted:rgba(26,16,48,.6)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;position:relative;overflow:hidden;transition:background .3s,color .3s}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.2;pointer-events:none}
.b1{width:500px;height:500px;background:var(--accent);top:-200px;left:-100px}
.b2{width:400px;height:400px;background:var(--accent2);bottom:-150px;right:-100px}
.content{position:relative;z-index:1;max-width:500px}
.num{font-size:clamp(6rem,20vw,10rem);font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2),#f093fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:1rem;animation:float 3s ease-in-out infinite}
h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:700;margin-bottom:.75rem}
p{color:var(--muted);font-size:1rem;line-height:1.6;margin-bottom:2.5rem}
.btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn{padding:.85rem 2rem;border-radius:50px;font-size:.95rem;font-weight:600;text-decoration:none;transition:all .3s;display:inline-block;font-family:'Inter',sans-serif;cursor:pointer;border:none}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 25px rgba(176,106,179,.4)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 12px 35px rgba(176,106,179,.6)}
.btn-ghost{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.theme-btn{position:fixed;top:1.25rem;right:1.25rem;background:none;border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1rem;z-index:10}
.emoji{font-size:3rem;margin-bottom:1rem;display:block;animation:wiggle 2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes wiggle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
</style>
</head>
<body>
<div class="blob b1"></div>
<div class="blob b2"></div>
<button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
<div class="content">
  <span class="emoji">🔍</span>
  <div class="num">404</div>
  <h1>Страница не найдена</h1>
  <p>Кажется, эта страница отправилась на маникюр и пока недоступна.<br>Попробуйте вернуться на главную.</p>
  <div class="btns">
    <a href="/" class="btn btn-primary">✨ На главную</a>
    <a href="javascript:history.back()" class="btn btn-ghost">← Назад</a>
  </div>
</div>
<script>
(function(){
  const s=localStorage.getItem('theme')||'dark';
  document.documentElement.dataset.theme=s;
  document.getElementById('themeBtn').textContent=s==='dark'?'🌙':'☀️';
})();
function toggleTheme(){
  const h=document.documentElement;const d=h.dataset.theme==='dark';
  h.dataset.theme=d?'light':'dark';
  document.getElementById('themeBtn').textContent=d?'☀️':'🌙';
  localStorage.setItem('theme',h.dataset.theme);
}
</script>
</body>
</html>
