<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOW | Бьюти-платформа</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #faf6f5; color: #1a1a2e; }
        .header { background: linear-gradient(135deg, #2d1b4e 0%, #4a2c6d 50%, #c77d9e 100%); color: white; padding: 20px 0; position: sticky; top: 0; z-index: 100; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        .header-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .logo { font-size: 28px; font-weight: 700; background: linear-gradient(135deg, #fff, #f0c0d0); -webkit-background-clip: text; background-clip: text; color: transparent; text-decoration: none; }
        .nav-links { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
        .nav-link { color: white; text-decoration: none; font-weight: 500; cursor: pointer; transition: opacity 0.2s; }
        .auth-buttons { display: flex; gap: 12px; }
        .btn-outline-light { background: transparent; border: 1px solid rgba(255,255,255,0.5); color: white; padding: 8px 20px; border-radius: 40px; cursor: pointer; font-weight: 500; text-decoration: none; display: inline-block; }
        .user-info { display: flex; align-items: center; gap: 16px; }
        .role-panel { display: none; }
        .role-panel.active { display: block; }
        .hero { background: linear-gradient(135deg, #2d1b4e 0%, #4a2c6d 100%); color: white; padding: 60px 0; text-align: center; }
        .hero h1 { font-size: 48px; margin-bottom: 16px; }
        .search-box { max-width: 500px; margin: 32px auto 0; display: flex; gap: 12px; }
        .search-input { flex: 1; padding: 14px 20px; border: none; border-radius: 48px; font-size: 16px; }
        .search-btn { background: #c77d9e; border: none; padding: 14px 28px; border-radius: 48px; color: white; cursor: pointer; }
        .slider-container { position: relative; overflow: hidden; border-radius: 24px; margin: 40px 0; }
        .slider-track { display: flex; transition: transform 0.5s ease; }
        .slider-slide { min-width: 100%; box-sizing: border-box; text-align: center; background: white; border-radius: 24px; overflow: hidden; }
        .slider-slide img { width: 100%; height: 300px; object-fit: cover; }
        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
        .categories-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; margin: 40px 0; }
        .category-card { background: white; padding: 24px; border-radius: 20px; text-align: center; cursor: pointer; transition: all 0.3s; border: 1px solid #f0e0e5; }
        .filters { background: white; padding: 20px; border-radius: 20px; margin: 24px 0; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
        .filters input, .filters select { padding: 10px 16px; border: 1px solid #e2d0d8; border-radius: 40px; }
        .masters-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; margin: 24px 0; }
        .master-card { background: white; border-radius: 24px; overflow: hidden; transition: all 0.3s; border: 1px solid #f0e0e5; cursor: pointer; }
        .master-card:hover { transform: translateY(-4px); box-shadow: 0 20px 30px rgba(0,0,0,0.1); }
        .master-info { padding: 20px; }
        .master-name { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .book-btn { width: 100%; background: linear-gradient(135deg, #c77d9e, #a85a7a); border: none; padding: 10px; border-radius: 40px; color: white; cursor: pointer; margin-top: 8px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 24px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-header { padding: 20px; border-bottom: 1px solid #f0e0e5; display: flex; justify-content: space-between; }
        .modal-body { padding: 20px; }
        .master-photo { width: 100%; height: 250px; object-fit: cover; border-radius: 20px; margin-bottom: 16px; }
        .portfolio-grid { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
        .portfolio-img { width: 100px; height: 100px; object-fit: cover; border-radius: 12px; }
        .review-item { background: #faf6f5; border-radius: 16px; padding: 12px; margin-bottom: 12px; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #2d1b4e; color: white; padding: 12px 24px; border-radius: 40px; z-index: 2000; }
        footer { text-align: center; padding: 40px 0; color: #888; border-top: 1px solid #f0e0e5; margin-top: 40px; }
        @media (max-width: 768px) { .hero h1 { font-size: 32px; } .search-box { flex-direction: column; } }
    </style>
</head>
<body>

<header class="header">
    <div class="container">
        <div class="header-content">
            <a href="/" class="logo">GLOW</a>
            <div class="nav-links">
                <span class="nav-link" onclick="switchRole('client')">Клиентам</span>
                <span class="nav-link" onclick="switchRole('master')">Мастерам</span>
                <span class="nav-link" onclick="switchRole('admin')">Администраторам</span>
                <div id="authSection" class="auth-buttons">
                    <a href="/auth.html" class="btn-outline-light">Вход</a>
                    <a href="/auth.html" class="btn-outline-light">Регистрация</a>
                </div>
                <div id="userSection" class="user-info" style="display:none">
                    <a id="profileLink" href="/client-profile.html" class="nav-link" style="color:white">Личный кабинет</a>
                    <span class="user-name" id="userName"></span>
                    <button class="logout-btn" onclick="logout()" style="background:rgba(255,255,255,0.2); border:none; padding:6px 16px; border-radius:40px; cursor:pointer;">Выйти</button>
                </div>
            </div>
        </div>
    </div>
</header>

<main>
    <div id="client-panel" class="role-panel active">
        <section class="hero">
            <div class="container">
                <h1>Красота, которая вам идёт</h1>
                <p>Топ-мастера бьюти-сферы вашего города</p>
                <div class="search-box">
                    <input type="text" id="searchInput" class="search-input" placeholder="Поиск по имени или категории...">
                    <button class="search-btn" onclick="loadMasters()">Найти</button>
                </div>
                <div style="margin-top:20px">
                    <input type="text" id="promoCodeInput" placeholder="Промокод" style="padding:10px 20px; border-radius:40px; border:none">
                    <button onclick="applyPromoCode()" style="padding:10px 20px; border-radius:40px; background:#f59e0b; border:none; cursor:pointer">Применить</button>
                    <span id="promoMessage"></span>
                </div>
            </div>
        </section>
        <div class="container">
            <div class="slider-container"><div class="slider-track" id="sliderTrack"></div><button class="slider-btn prev" onclick="prevSlide()">‹</button><button class="slider-btn next" onclick="nextSlide()">›</button></div>
            <div class="slider-dots" id="sliderDots"></div>
            <div class="categories-grid" id="categoriesGrid"></div>
            <div class="filters"><input type="number" id="filterPrice" placeholder="Макс. цена"><select id="filterRating"><option value="0">Любой рейтинг</option><option value="4.5">4.5+</option><option value="4.8">4.8+</option></select><button onclick="resetFilters()">Сбросить</button></div>
            <div id="mastersGrid" class="masters-grid"></div>
        </div>
    </div>
    <div id="master-panel" class="role-panel"><div class="container" style="padding:60px 0;text-align:center"><h2>Панель мастера</h2><p><a href="/master-profile.html">Перейти в личный кабинет мастера →</a></p></div></div>
    <div id="admin-panel" class="role-panel"><div class="container" style="padding:60px 0;text-align:center"><h2>Админ-панель</h2><p><a href="/admin-profile.html">Перейти в админ-панель →</a></p></div></div>
</main>
<footer><div class="container"><p>GLOW — поиск бьюти-мастеров. Красота начинается здесь.</p></div></footer>

<!-- Модалка карточки мастера -->
<div id="masterModal" class="modal"><div class="modal-content"><div class="modal-header"><h3 id="modalMasterName"></h3><button onclick="closeMasterModal()">✕</button></div><div class="modal-body" id="modalMasterBody"></div></div></div>

<script>
let currentUser = JSON.parse(localStorage.getItem('glow_current_user'));
let currentSlide = 0;
let activePromoDiscount = 0;
let allMasters = [
    { id: 1, name: "Анна Соловьёва", category: "Макияж", specialization: "Свадебный визаж", price: 4500, rating: 4.9, reviews: 128, photo: "https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?w=400", description: "Визажист с 7-летним опытом. Работала с известными блогерами и на неделях моды.", portfolio: ["https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=200","https://images.unsplash.com/photo-1512496015851-a90ab38aba96?w=200"] },
    { id: 2, name: "Елена Морозова", category: "Маникюр", specialization: "Нейл-дизайн", price: 2500, rating: 4.8, reviews: 94, photo: "https://images.unsplash.com/photo-1604654894610-df4906b1150c?w=400", description: "Мастер маникюра с 5-летним стажем. Сложный дизайн, выравнивание.", portfolio: ["https://images.unsplash.com/photo-1604654894610-df4906b1150c?w=200"] },
    { id: 3, name: "Мария Волкова", category: "Брови", specialization: "Архитектура бровей", price: 1800, rating: 5.0, reviews: 56, photo: "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=400", description: "Бровист с медицинским образованием. Коррекция, окрашивание, ламинирование.", portfolio: ["https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=200"] },
    { id: 4, name: "Ольга Новикова", category: "Волосы", specialization: "Стилист", price: 3500, rating: 4.7, reviews: 73, photo: "https://images.unsplash.com/photo-1562322140-8baeececf3df?w=400", description: "Стилист-парикмахер. Стрижки, окрашивание, укладки.", portfolio: ["https://images.unsplash.com/photo-1562322140-8baeececf3df?w=200"] },
    { id: 5, name: "Татьяна Белова", category: "Макияж", specialization: "Вечерний образ", price: 4000, rating: 4.8, reviews: 45, photo: "https://images.unsplash.com/photo-1512496015851-a90ab38aba96?w=400", description: "Визажист. Специализация: вечерний и свадебный макияж.", portfolio: ["https://images.unsplash.com/photo-1512496015851-a90ab38aba96?w=200"] },
    { id: 6, name: "Ирина Соколова", category: "Уход", specialization: "Косметолог", price: 3000, rating: 4.6, reviews: 38, photo: "https://images.unsplash.com/photo-1598440947619-2c35fc9aa908?w=400", description: "Косметолог. Чистки, уходовые процедуры.", portfolio: ["https://images.unsplash.com/photo-1598440947619-2c35fc9aa908?w=200"] }
];
if (!localStorage.getItem('glow_masters')) localStorage.setItem('glow_masters', JSON.stringify(allMasters));
let masters = JSON.parse(localStorage.getItem('glow_masters'));
let appointments = JSON.parse(localStorage.getItem('glow_appointments')) || [];
let reviews = JSON.parse(localStorage.getItem('glow_reviews')) || [];
let promoCodes = JSON.parse(localStorage.getItem('glow_promocodes')) || [{ code: "WELCOME10", discount: 10, usedBy: [] }];
const categories = [{ name: "Макияж", icon: "💄", count: 24 },{ name: "Маникюр", icon: "💅", count: 18 },{ name: "Брови", icon: "✨", count: 12 },{ name: "Волосы", icon: "💇‍♀️", count: 15 },{ name: "Уход", icon: "🧖‍♀️", count: 9 }];
const topMasters = allMasters.slice(0, 3);

function renderSlider() { const track = document.getElementById('sliderTrack'); track.innerHTML = topMasters.map(m => `<div class="slider-slide"><img src="${m.photo}"><div style="padding:20px"><h3>${m.name}</h3><p>${m.category} • ⭐ ${m.rating}</p><p>${m.price.toLocaleString()} ₽</p><button class="book-btn" onclick="bookMaster(${m.id})">Записаться</button></div></div>`).join(''); document.getElementById('sliderDots').innerHTML = topMasters.map((_, i) => `<span class="dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})"></span>`).join(''); }
function prevSlide() { currentSlide = (currentSlide - 1 + topMasters.length) % topMasters.length; updateSlider(); }
function nextSlide() { currentSlide = (currentSlide + 1) % topMasters.length; updateSlider(); }
function goToSlide(i) { currentSlide = i; updateSlider(); }
function updateSlider() { document.getElementById('sliderTrack').style.transform = `translateX(-${currentSlide * 100}%)`; document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === currentSlide)); }
function renderCategories() { document.getElementById('categoriesGrid').innerHTML = categories.map(c => `<div class="category-card" onclick="filterByCategory('${c.name}')"><div style="font-size:32px">${c.icon}</div><div>${c.name}</div><div>${c.count} мастеров</div></div>`).join(''); }
function filterByCategory(cat) { document.getElementById('searchInput').value = cat; loadMasters(); }
function loadMasters() {
    let filtered = [...masters];
    const search = document.getElementById('searchInput')?.value.toLowerCase() || '';
    const maxPrice = parseInt(document.getElementById('filterPrice')?.value);
    const minRating = parseFloat(document.getElementById('filterRating')?.value);
    if (search) filtered = filtered.filter(m => m.name.toLowerCase().includes(search) || m.category.toLowerCase().includes(search));
    if (maxPrice) filtered = filtered.filter(m => m.price <= maxPrice);
    if (minRating) filtered = filtered.filter(m => m.rating >= minRating);
    document.getElementById('mastersGrid').innerHTML = filtered.map(m => `
        <div class="master-card" onclick="openMasterModal(${m.id})">
            <div class="master-info">
                <div class="master-name">${m.name}</div>
                <div>${m.category} • ${m.specialization}</div>
                <div>⭐ ${m.rating} (${m.reviews} отзывов)</div>
                <div>${(m.price * (100 - activePromoDiscount) / 100).toLocaleString()} ₽</div>
                <button class="book-btn" onclick="event.stopPropagation(); bookMaster(${m.id})">Записаться</button>
            </div>
        </div>
    `).join('');
}
function openMasterModal(masterId) {
    const m = masters.find(m => m.id === masterId);
    const masterReviews = reviews.filter(r => r.masterId === masterId);
    document.getElementById('modalMasterName').innerText = m.name;
    document.getElementById('modalMasterBody').innerHTML = `
        <img src="${m.photo}" class="master-photo">
        <p><strong>${m.category} • ${m.specialization}</strong></p>
        <p>⭐ ${m.rating} (${m.reviews} отзывов) • ${m.price.toLocaleString()} ₽/час</p>
        <p>${m.description || 'Нет описания'}</p>
        <h4>📸 Портфолио</h4>
        <div class="portfolio-grid">${(m.portfolio || []).map(p => `<img src="${p}" class="portfolio-img">`).join('') || '<p>Нет примеров работ</p>'}</div>
        <h4>💬 Отзывы</h4>
        ${masterReviews.length ? masterReviews.map(r => `<div class="review-item"><strong>${r.userName}</strong> ★${r.rating}<br>${r.text}</div>`).join('') : '<p>Пока нет отзывов</p>'}
        <button class="book-btn" onclick="bookMaster(${m.id}); closeMasterModal();">Записаться</button>
    `;
    document.getElementById('masterModal').style.display = 'flex';
}
function closeMasterModal() { document.getElementById('masterModal').style.display = 'none'; }
function resetFilters() { document.getElementById('filterPrice').value = ''; document.getElementById('filterRating').value = '0'; document.getElementById('searchInput').value = ''; loadMasters(); }
function applyPromoCode() { const code = document.getElementById('promoCodeInput').value.toUpperCase(); const promo = promoCodes.find(p => p.code === code && !p.usedBy.includes(currentUser?.id)); if (promo && currentUser) { activePromoDiscount = promo.discount; document.getElementById('promoMessage').innerHTML = `<span style="color:#22c55e">✅ Скидка ${promo.discount}%</span>`; promo.usedBy.push(currentUser.id); localStorage.setItem('glow_promocodes', JSON.stringify(promoCodes)); loadMasters(); } else { document.getElementById('promoMessage').innerHTML = '<span style="color:#dc2626">❌ Неверный промокод</span>'; } }
function bookMaster(masterId) { if (!currentUser) { showToast('Войдите в аккаунт'); return; } const date = prompt('Дата (ГГГГ-ММ-ДД):'); const time = prompt('Время (например, 14:00):'); if (!date || !time) return; const master = masters.find(m => m.id === masterId); const finalPrice = master.price * (100 - activePromoDiscount) / 100; appointments.push({ id: Date.now(), masterId, masterName: master.name, clientId: currentUser.id, clientName: currentUser.fullName, date, time, totalCost: finalPrice, status: 'pending' }); localStorage.setItem('glow_appointments', JSON.stringify(appointments)); showToast('Заявка отправлена!'); activePromoDiscount = 0; document.getElementById('promoMessage').innerHTML = ''; }
function showToast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.innerText = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
function switchRole(role) { document.querySelectorAll('.role-panel').forEach(p => p.classList.remove('active')); document.getElementById(`${role}-panel`).classList.add('active'); }
function updateAuthUI() { if (currentUser) { document.getElementById('authSection').style.display = 'none'; document.getElementById('userSection').style.display = 'flex'; document.getElementById('userName').innerText = currentUser.fullName || currentUser.email; const profileLink = document.getElementById('profileLink'); if (currentUser.role === 'client') profileLink.href = '/client-profile.html'; else if (currentUser.role === 'master') profileLink.href = '/master-profile.html'; else if (currentUser.role === 'admin') profileLink.href = '/admin-profile.html'; } else { document.getElementById('authSection').style.display = 'flex'; document.getElementById('userSection').style.display = 'none'; } }
function logout() { localStorage.removeItem('glow_current_user'); window.location.reload(); }
renderSlider(); renderCategories(); loadMasters(); updateAuthUI();
</script>
</body>
</html>
