<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOW | Кабинет мастера</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #faf6f5; color: #1a1a2e; }
        .header { background: linear-gradient(135deg, #2d1b4e 0%, #4a2c6d 50%, #c77d9e 100%); color: white; padding: 16px 0; }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 24px; }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, #fff, #f0c0d0); -webkit-background-clip: text; background-clip: text; color: transparent; text-decoration: none; }
        .logout-btn { background: rgba(255,255,255,0.2); border: none; padding: 6px 14px; border-radius: 40px; color: white; cursor: pointer; font-size: 14px; font-family: inherit; }

        .profile-container { max-width: 1000px; margin: 32px auto; background: white; border-radius: 32px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.06); }
        .profile-header { background: linear-gradient(135deg, #2d1b4e, #4a2c6d); padding: 36px 40px; color: white; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
        .avatar { width: 72px; height: 72px; background: #c77d9e; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; flex-shrink: 0; }
        .profile-name { font-size: 22px; font-weight: 700; }
        .profile-sub { opacity: 0.75; font-size: 14px; margin-top: 4px; }

        /* Статистика */
        .stats-row { display: flex; gap: 16px; flex-wrap: wrap; padding: 20px 32px; border-bottom: 1px solid #f0e0e5; }
        .stat-card { flex: 1; min-width: 120px; background: #faf6f5; border-radius: 16px; padding: 16px; text-align: center; }
        .stat-number { font-size: 28px; font-weight: 700; color: #2d1b4e; }
        .stat-label { font-size: 12px; color: #888; margin-top: 4px; }

        .tabs { display: flex; border-bottom: 1px solid #f0e0e5; }
        .tab { flex: 1; padding: 16px; text-align: center; cursor: pointer; font-weight: 600; color: #888; font-size: 14px; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab.active { color: #2d1b4e; border-bottom-color: #c77d9e; }
        .tab-content { display: none; padding: 28px 32px; }
        .tab-content.active { display: block; }

        /* Заявки */
        .booking-card { background: #faf6f5; border-radius: 20px; padding: 18px 20px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .booking-left strong { font-size: 15px; }
        .booking-meta { font-size: 13px; color: #666; margin-top: 4px; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-pending  { background: #fef3c7; color: #92400e; }
        .status-confirmed { background: #d1fae5; color: #065f46; }
        .status-completed { background: #e0e7ff; color: #3730a3; }
        .status-cancelled { background: #fee2e2; color: #991b1b; }
        .action-row { display: flex; gap: 8px; }
        .btn-confirm { background: #d1fae5; border: none; padding: 7px 14px; border-radius: 40px; color: #065f46; cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600; }
        .btn-reject { background: #fee2e2; border: none; padding: 7px 14px; border-radius: 40px; color: #dc2626; cursor: pointer; font-size: 13px; font-family: inherit; }
        .btn-complete { background: #e0e7ff; border: none; padding: 7px 14px; border-radius: 40px; color: #3730a3; cursor: pointer; font-size: 13px; font-family: inherit; }

        /* Портфолио */
        .portfolio-grid-edit { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
        .portfolio-item-edit { position: relative; }
        .portfolio-img-edit { width: 100px; height: 100px; object-fit: cover; border-radius: 14px; display: block; }
        .remove-photo { position: absolute; top: -6px; right: -6px; background: #dc2626; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }
        .add-photo-form { background: #faf6f5; border-radius: 16px; padding: 20px; }
        .add-photo-form input { width: 100%; padding: 11px 14px; border: 1.5px solid #e2d0d8; border-radius: 12px; font-family: inherit; font-size: 14px; outline: none; margin-bottom: 10px; }
        .add-photo-form input:focus { border-color: #c77d9e; }

        /* Настройки */
        .edit-form { background: #faf6f5; border-radius: 20px; padding: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; }
        .form-group input, .form-group textarea { width: 100%; padding: 11px 14px; border: 1.5px solid #e2d0d8; border-radius: 14px; font-family: inherit; font-size: 15px; outline: none; }
        .form-group input:focus, .form-group textarea:focus { border-color: #c77d9e; }
        .form-group textarea { resize: vertical; }

        .btn-save { background: linear-gradient(135deg, #c77d9e, #a85a7a); border: none; padding: 12px 24px; border-radius: 40px; color: white; font-weight: 600; cursor: pointer; font-family: inherit; }
        .empty-state { text-align: center; padding: 40px 20px; color: #999; font-size: 14px; }

        .toast { position: fixed; bottom: 24px; right: 24px; background: #2d1b4e; color: white; padding: 12px 24px; border-radius: 40px; z-index: 2000; font-size: 14px; }
        @media (max-width: 600px) { .profile-header { flex-direction: column; text-align: center; } .stats-row { flex-direction: column; } .tab-content { padding: 20px 16px; } }
    </style>
</head>
<body>
<header class="header">
    <div class="container">
        <div class="header-content">
            <a href="/" class="logo">✨ GLOW</a>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
    </div>
</header>

<div class="profile-container">
    <div class="profile-header">
        <div class="avatar">👩‍🎨</div>
        <div>
            <div class="profile-name" id="masterName">Загрузка...</div>
            <div class="profile-sub" id="masterCategory"></div>
            <div style="margin-top:8px;font-size:13px;opacity:0.7">Мастер GLOW</div>
        </div>
    </div>

    <!-- Статистика -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-number" id="statTotal">0</div>
            <div class="stat-label">Всего заявок</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="statPending">0</div>
            <div class="stat-label">Ожидают</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="statConfirmed">0</div>
            <div class="stat-label">Подтверждено</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="statCompleted">0</div>
            <div class="stat-label">Завершено</div>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="appointments"><i class="fas fa-list"></i> Заявки</div>
        <div class="tab" data-tab="portfolio"><i class="fas fa-images"></i> Портфолио</div>
        <div class="tab" data-tab="settings"><i class="fas fa-cog"></i> Настройки</div>
    </div>

    <div id="appointments-tab" class="tab-content active">
        <div id="appointmentsList"></div>
    </div>

    <div id="portfolio-tab" class="tab-content">
        <div class="portfolio-grid-edit" id="portfolioList"></div>
        <div class="add-photo-form">
            <h4 style="margin-bottom:12px">Добавить работу</h4>
            <input type="url" id="newPhotoUrl" placeholder="Вставьте URL фотографии">
            <button class="btn-save" onclick="addPortfolio()">Добавить</button>
        </div>
    </div>

    <div id="settings-tab" class="tab-content">
        <div class="edit-form">
            <h3 style="margin-bottom:20px">Редактировать профиль</h3>
            <div class="form-group"><label>Имя</label><input type="text" id="editName"></div>
            <div class="form-group"><label>Категория</label><input type="text" id="editCategory" placeholder="Макияж, Маникюр..."></div>
            <div class="form-group"><label>Специализация</label><input type="text" id="editSpecialization"></div>
            <div class="form-group"><label>Цена за час, ₽</label><input type="number" id="editPrice" min="0"></div>
            <div class="form-group"><label>О себе</label><textarea id="editDescription" rows="4" placeholder="Расскажите о своём опыте и услугах..."></textarea></div>
            <button class="btn-save" onclick="saveProfile()">Сохранить</button>
        </div>
    </div>
</div>

<script>
const TOKEN = localStorage.getItem('glow_token');
let currentUser = JSON.parse(localStorage.getItem('glow_current_user'));
let allBookings = [];
let masterData = JSON.parse(localStorage.getItem('glow_master_data') || 'null');

if (!currentUser) window.location.href = '/auth.html';
if (currentUser && currentUser.role !== 'master') window.location.href = '/';

const authHeaders = { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' };

const statusLabel = { pending: '⏳ Ожидает', confirmed: '✅ Подтверждено', completed: '🎉 Завершено', cancelled: '❌ Отменено' };
const statusClass = { pending: 'status-pending', confirmed: 'status-confirmed', completed: 'status-completed', cancelled: 'status-cancelled' };

// ─── Инициализация ────────────────────────────────────────────────────────────
function updateUI() {
    document.getElementById('masterName').textContent = masterData?.name || currentUser.fullName;
    document.getElementById('masterCategory').textContent = masterData?.category ? `${masterData.category} · ${masterData.specialization || ''}` : '';
    document.getElementById('editName').value = masterData?.name || currentUser.fullName;
    document.getElementById('editCategory').value = masterData?.category || '';
    document.getElementById('editSpecialization').value = masterData?.specialization || '';
    document.getElementById('editPrice').value = masterData?.price || '';
    document.getElementById('editDescription').value = masterData?.description || '';
}

// ─── Заявки ───────────────────────────────────────────────────────────────────
async function loadAppointments() {
    try {
        const res = await fetch('/api/bookings', { headers: authHeaders });
        allBookings = res.ok ? await res.json() : [];
    } catch { allBookings = []; }
    renderAppointments();
    updateStats();
}

function renderAppointments() {
    if (!allBookings.length) {
        document.getElementById('appointmentsList').innerHTML = '<div class="empty-state">📭 Новых заявок пока нет</div>';
        return;
    }
    document.getElementById('appointmentsList').innerHTML = allBookings.map(a => `
        <div class="booking-card">
            <div class="booking-left">
                <strong>${a.clientName}</strong>
                <div class="booking-meta">📅 ${a.date} · 🕐 ${a.time} · 💰 ${a.totalCost.toLocaleString()} ₽</div>
            </div>
            <div class="action-row">
                <span class="status-badge ${statusClass[a.status] || ''}">${statusLabel[a.status] || a.status}</span>
                ${a.status === 'pending' ? `
                    <button class="btn-confirm" onclick="updateStatus(${a.id}, 'confirmed')">Принять</button>
                    <button class="btn-reject" onclick="updateStatus(${a.id}, 'cancelled')">Отклонить</button>` : ''}
                ${a.status === 'confirmed' ? `
                    <button class="btn-complete" onclick="updateStatus(${a.id}, 'completed')">Завершить</button>` : ''}
            </div>
        </div>`).join('');
}

function updateStats() {
    document.getElementById('statTotal').textContent = allBookings.length;
    document.getElementById('statPending').textContent = allBookings.filter(b => b.status === 'pending').length;
    document.getElementById('statConfirmed').textContent = allBookings.filter(b => b.status === 'confirmed').length;
    document.getElementById('statCompleted').textContent = allBookings.filter(b => b.status === 'completed').length;
}

async function updateStatus(id, status) {
    const res = await fetch(`/api/bookings/${id}`, {
        method: 'PATCH',
        headers: authHeaders,
        body: JSON.stringify({ status })
    });
    if (res.ok) {
        const labels = { confirmed: 'Заявка принята', cancelled: 'Заявка отклонена', completed: 'Записано как завершённое' };
        showToast(labels[status] || 'Статус обновлён');
        loadAppointments();
    } else showToast('Ошибка обновления статуса');
}

// ─── Портфолио ────────────────────────────────────────────────────────────────
function loadPortfolio() {
    const portfolio = masterData?.portfolio || [];
    document.getElementById('portfolioList').innerHTML = portfolio.length
        ? portfolio.map((p, i) => `
            <div class="portfolio-item-edit">
                <img src="${p}" class="portfolio-img-edit" alt="Работа ${i+1}">
                <button class="remove-photo" onclick="removePortfolio(${i})">✕</button>
            </div>`).join('')
        : '<p style="color:#999;font-size:14px">Добавьте первые работы</p>';
}

function addPortfolio() {
    const url = document.getElementById('newPhotoUrl').value.trim();
    if (!url) { showToast('Введите URL фото'); return; }
    if (!masterData) masterData = {};
    if (!masterData.portfolio) masterData.portfolio = [];
    masterData.portfolio.push(url);
    localStorage.setItem('glow_master_data', JSON.stringify(masterData));
    document.getElementById('newPhotoUrl').value = '';
    loadPortfolio();
    showToast('Фото добавлено');
}

function removePortfolio(index) {
    masterData.portfolio.splice(index, 1);
    localStorage.setItem('glow_master_data', JSON.stringify(masterData));
    loadPortfolio();
}

// ─── Настройки ────────────────────────────────────────────────────────────────
function saveProfile() {
    if (!masterData) masterData = {};
    masterData.name = document.getElementById('editName').value.trim();
    masterData.category = document.getElementById('editCategory').value.trim();
    masterData.specialization = document.getElementById('editSpecialization').value.trim();
    masterData.price = parseInt(document.getElementById('editPrice').value) || 0;
    masterData.description = document.getElementById('editDescription').value.trim();
    localStorage.setItem('glow_master_data', JSON.stringify(masterData));
    updateUI();
    showToast('✅ Профиль обновлён');
}

function showToast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
}
function logout() { localStorage.removeItem('glow_token'); localStorage.removeItem('glow_current_user'); window.location.href = '/'; }

// ─── Табы ─────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(`${tab.dataset.tab}-tab`).classList.add('active');
        if (tab.dataset.tab === 'portfolio') loadPortfolio();
    });
});

updateUI();
loadAppointments();
</script>
</body>
</html>
