<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой профиль | GLOW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0a1e;--bg2:#1a1030;--card:#1e1535;--border:rgba(255,255,255,.08);--text:#f0eaff;--muted:rgba(240,234,255,.6);--accent:#b06ab3;--accent2:#4776e6;--radius:16px;--input-bg:rgba(255,255,255,.05)}
[data-theme="light"]{--bg:#faf8ff;--bg2:#f0ebff;--card:#fff;--border:rgba(0,0,0,.08);--text:#1a1030;--muted:rgba(26,16,48,.6);--input-bg:rgba(0,0,0,.03)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s;min-height:100vh}
.navbar{position:fixed;top:0;left:0;right:0;z-index:100;padding:0 2rem;height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:rgba(15,10,30,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);transition:background .3s}
[data-theme="light"] .navbar{background:rgba(250,248,255,.95);border-bottom-color:rgba(0,0,0,.08)}
.nav-logo{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;justify-self:start}
.nav-right{display:flex;gap:.75rem;align-items:center;justify-self:end}
.logout-btn{background:none;border:1px solid rgba(245,87,108,.3);color:#f5576c;padding:.5rem 1.1rem;border-radius:10px;cursor:pointer;font-size:.85rem;font-family:'Inter',sans-serif;transition:all .2s}
.logout-btn:hover{background:rgba(245,87,108,.1)}
.theme-btn{background:none;border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem}
.page{padding:6rem 2rem 3rem;max-width:1000px;margin:0 auto}
.profile-header{display:flex;align-items:center;gap:1.5rem;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;margin-bottom:2rem;position:relative;overflow:hidden}
.profile-header::before{content:'';position:absolute;width:300px;height:300px;background:radial-gradient(circle,rgba(176,106,179,.12),transparent 70%);top:-100px;right:-50px;pointer-events:none}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 8px 20px rgba(176,106,179,.4)}
.profile-info h1{font-size:1.4rem;font-weight:700}
.profile-info p{color:var(--muted);font-size:.9rem;margin-top:.2rem}
.role-badge{display:inline-block;padding:.25rem .75rem;border-radius:20px;font-size:.75rem;font-weight:600;margin-top:.5rem}
.badge-admin{background:rgba(255,215,0,.15);color:#ffd700}
.badge-master{background:rgba(176,106,179,.2);color:var(--accent)}
.badge-client{background:rgba(71,118,230,.15);color:var(--accent2)}
.tabs{display:flex;gap:.5rem;margin-bottom:2rem;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:.75rem 1.25rem;background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;font-weight:500;font-family:'Inter',sans-serif;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;white-space:nowrap;flex-shrink:0}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none}.tab-content.active{display:block}
/* Cards */
.booking-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.5rem;margin-bottom:.75rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;transition:border-color .2s}
.booking-card:hover{border-color:rgba(176,106,179,.3)}
.booking-info h3{font-size:.95rem;font-weight:600;margin-bottom:.2rem}
.booking-info p{color:var(--muted);font-size:.82rem;margin-top:.15rem}
.booking-meta{text-align:right;flex-shrink:0}
.booking-date{font-size:.9rem;font-weight:600}
.b-status{display:inline-block;padding:.2rem .65rem;border-radius:20px;font-size:.72rem;font-weight:600;margin-top:.25rem}
.s-ok{background:rgba(67,233,123,.15);color:#43e97b}
.s-no{background:rgba(245,87,108,.15);color:#f5576c}
.s-moved{background:rgba(71,118,230,.15);color:var(--accent2)}
.btn-sm{background:none;border:1px solid var(--border);color:var(--muted);padding:.35rem .75rem;border-radius:8px;cursor:pointer;font-size:.78rem;font-family:'Inter',sans-serif;transition:all .2s;margin-top:.4rem;margin-right:.3rem}
.btn-sm:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm.danger:hover{border-color:#f5576c;color:#f5576c}
/* Favs */
.fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1rem}
.fav-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;text-align:center;cursor:pointer;transition:all .3s}
.fav-card:hover{border-color:var(--accent);transform:translateY(-3px)}
.fav-av{width:56px;height:56px;border-radius:50%;margin:0 auto .75rem;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;color:#fff}
.fav-card h3{font-size:.9rem;font-weight:600;margin-bottom:.2rem}
.fav-card p{color:var(--accent);font-size:.78rem}
/* Settings */
.settings-form{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:2rem}
.form-group{margin-bottom:1.1rem}
label{display:block;font-size:.82rem;font-weight:500;margin-bottom:.4rem;opacity:.8}
input,select,textarea{width:100%;padding:.8rem 1rem;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.9rem;font-family:'Inter',sans-serif;transition:border-color .2s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select option{background:var(--bg)}
textarea{resize:vertical;min-height:70px}
.btn{padding:.8rem 1.75rem;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:12px;font-size:.9rem;font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s;font-family:'Inter',sans-serif}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(176,106,179,.4)}
/* Admin */
.admin-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;text-align:center}
.stat-val{font-size:1.9rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-lbl{font-size:.78rem;color:var(--muted);margin-top:.2rem}
.admin-section{margin-bottom:2rem}
.admin-section-title{font-size:1rem;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
.admin-table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.admin-table th{padding:.75rem 1rem;text-align:left;font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:rgba(176,106,179,.05)}
.admin-table td{padding:.75rem 1rem;font-size:.82rem;border-bottom:1px solid var(--border);vertical-align:middle}
.admin-table tr:last-child td{border-bottom:none}
.admin-table tr:hover td{background:rgba(176,106,179,.03)}
.badge{display:inline-block;padding:.15rem .6rem;border-radius:20px;font-size:.7rem;font-weight:600}
.bg-green{background:rgba(67,233,123,.15);color:#43e97b}
.bg-red{background:rgba(245,87,108,.15);color:#f5576c}
.bg-blue{background:rgba(71,118,230,.15);color:var(--accent2)}
.bg-purple{background:rgba(176,106,179,.15);color:var(--accent)}
.bg-yellow{background:rgba(255,215,0,.15);color:#ffd700}
.bg-orange{background:rgba(255,149,0,.15);color:#ff9500}
.admin-btn{padding:.55rem 1.1rem;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:9px;cursor:pointer;font-size:.82rem;font-family:'Inter',sans-serif;transition:all .2s}
.admin-btn:hover{border-color:var(--accent);color:var(--accent)}
.admin-btn.danger{border-color:rgba(245,87,108,.3);color:#f5576c}
.admin-btn.danger:hover{background:rgba(245,87,108,.1)}
.admin-btn.success{border-color:rgba(67,233,123,.3);color:#43e97b}
.admin-btn.success:hover{background:rgba(67,233,123,.1)}
.actions-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:500;display:none;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:20px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal-hdr{padding:1.5rem 1.5rem 1rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:1}
.modal-hdr h3{font-size:1.1rem;font-weight:700}
.modal-close{background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:rgba(255,255,255,.1)}
.modal-body{padding:1.5rem}
/* Time slots for admin */
.slot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-top:.5rem}
.slot-btn{padding:.5rem .3rem;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;font-size:.78rem;font-family:'Inter',sans-serif;transition:all .2s;text-align:center}
.slot-btn:hover{border-color:var(--accent)}
.slot-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.slot-btn.blocked{background:rgba(245,87,108,.1);border-color:rgba(245,87,108,.3);color:#f5576c;cursor:not-allowed;opacity:.6}
.slot-btn.toggle-blocked{background:rgba(245,87,108,.1);border-color:rgba(245,87,108,.4);color:#f5576c}
.slot-btn.toggle-blocked:hover{background:rgba(245,87,108,.2)}
/* Schedule week grid */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.5rem;margin-bottom:1rem}
.day-col{text-align:center}
.day-label{font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:.4rem;text-transform:uppercase}
.day-slot{padding:.3rem .2rem;background:var(--bg2);border:1px solid var(--border);border-radius:6px;font-size:.7rem;cursor:pointer;transition:all .2s;margin-bottom:.25rem;text-align:center}
.day-slot.free{border-color:rgba(67,233,123,.3);color:#43e97b}
.day-slot.occupied{background:rgba(176,106,179,.1);border-color:rgba(176,106,179,.3);color:var(--accent)}
.day-slot.blocked-admin{background:rgba(245,87,108,.1);border-color:rgba(245,87,108,.3);color:#f5576c}
/* Empty */
.empty-state{text-align:center;padding:3rem 2rem;color:var(--muted)}
.empty-state .icon{font-size:3rem;margin-bottom:.75rem}
/* Toast */
.toast{position:fixed;top:2rem;right:2rem;padding:1rem 1.5rem;border-radius:12px;font-size:.9rem;font-weight:500;z-index:9999;transform:translateX(120%);transition:transform .3s;max-width:320px}
.toast.show{transform:translateX(0)}
.toast.success{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#0a2e1a}
.toast.error{background:linear-gradient(135deg,#f5576c,#f093fb);color:#fff}
.toast.info{background:linear-gradient(135deg,#4facfe,#00f2fe);color:#0a1e2e}
@media(max-width:640px){.booking-card{flex-direction:column;align-items:flex-start}.booking-meta{text-align:left}.profile-header{flex-direction:column;text-align:center}.admin-stats{grid-template-columns:1fr 1fr}.slot-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<nav class="navbar">
  <a href="/" class="nav-logo">✨ GLOW</a>
  <div></div>
  <div class="nav-right">
    <a href="/" style="color:var(--muted);text-decoration:none;font-size:.85rem">Главная</a>
    <button class="logout-btn" onclick="logout()">Выйти</button>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
</nav>

<div class="page">
  <div class="profile-header">
    <div class="avatar" id="userAvatar">?</div>
    <div class="profile-info">
      <h1 id="userName">—</h1>
      <p id="userEmail">—</p>
      <div class="role-badge" id="userRoleBadge"></div>
    </div>
  </div>

  <div class="tabs" id="tabsContainer">
    <button class="tab active" onclick="showTab('bookings',this)">📅 Мои записи</button>
    <button class="tab" onclick="showTab('favorites',this)">❤️ Избранное</button>
    <button class="tab" onclick="showTab('settings',this)">⚙️ Настройки</button>
  </div>

  <div id="bookings" class="tab-content active"><div id="bookingsList"></div></div>
  <div id="favorites" class="tab-content"><div id="favList" class="fav-grid"></div></div>
  <div id="settings" class="tab-content">
    <div class="settings-form">
      <h2 style="margin-bottom:1.5rem;font-size:1.15rem">Настройки профиля</h2>
      <div class="form-group"><label>Имя</label><input type="text" id="settingName"></div>
      <div class="form-group"><label>Email</label><input type="email" id="settingEmail" disabled style="opacity:.6"></div>
      <button class="btn" onclick="saveSettings()">Сохранить</button>
    </div>
  </div>

  <!-- ADMIN TAB -->
  <div id="admin" class="tab-content">

    <!-- Stats -->
    <div class="admin-stats" id="adminStats"></div>

    <div class="actions-row">
      <button class="admin-btn success" onclick="openModal('modalNewBooking')">➕ Записать клиента</button>
      <button class="admin-btn" onclick="openModal('modalSchedule')">📅 Расписание мастеров</button>
      <button class="admin-btn" onclick="adminRefresh()">🔄 Обновить</button>
      <button class="admin-btn" onclick="exportData()">📥 Экспорт JSON</button>
      <button class="admin-btn danger" onclick="clearAll()">🗑 Очистить все записи</button>
    </div>

    <!-- All bookings -->
    <div class="admin-section">
      <div class="admin-section-title">📋 Все записи</div>
      <div id="adminBookingsWrap"></div>
    </div>

    <!-- Masters -->
    <div class="admin-section">
      <div class="admin-section-title">💅 Мастера платформы</div>
      <div id="adminMastersWrap"></div>
    </div>

    <!-- Users -->
    <div class="admin-section">
      <div class="admin-section-title">👥 Пользователи</div>
      <div id="adminUsersWrap"></div>
    </div>

  </div>
</div>

<!-- ===== MODAL: Записать клиента ===== -->
<div class="modal-overlay" id="modalNewBooking" onclick="handleOverlay(event,'modalNewBooking')">
  <div class="modal-box">
    <div class="modal-hdr">
      <h3>➕ Записать клиента</h3>
      <button class="modal-close" onclick="closeModal('modalNewBooking')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label>Имя клиента</label><input type="text" id="nb_client" placeholder="Иванова Мария"></div>
      <div class="form-group"><label>Телефон</label><input type="tel" id="nb_phone" placeholder="+7 (999) 000-00-00"></div>
      <div class="form-group">
        <label>Мастер</label>
        <select id="nb_master" onchange="updateNewBookingSlots()">
          <option value="">— Выберите мастера —</option>
        </select>
      </div>
      <div class="form-group" id="nb_dur_wrap" style="display:none">
        <div style="padding:.6rem .9rem;background:rgba(176,106,179,.1);border-radius:8px;font-size:.82rem;color:var(--accent)" id="nb_dur_info"></div>
      </div>
      <div class="form-group"><label>Дата</label><input type="date" id="nb_date" onchange="updateNewBookingSlots()"></div>
      <div class="form-group">
        <label>Время <span id="nb_time_hint" style="color:var(--muted);font-size:.75rem"></span></label>
        <div class="slot-grid" id="nb_slots"></div>
      </div>
      <div class="form-group"><label>Комментарий</label><textarea id="nb_comment" placeholder="Пожелания..."></textarea></div>
      <div class="form-group">
        <label>Оплата</label>
        <select id="nb_pay">
          <option value="card">💳 Карта</option>
          <option value="sbp">📱 СБП</option>
          <option value="cash">💵 Наличные</option>
        </select>
      </div>
      <button class="btn" style="width:100%" onclick="saveNewBooking()">✅ Записать</button>
    </div>
  </div>
</div>

<!-- ===== MODAL: Расписание ===== -->
<div class="modal-overlay" id="modalSchedule" onclick="handleOverlay(event,'modalSchedule')">
  <div class="modal-box" style="max-width:680px">
    <div class="modal-hdr">
      <h3>📅 Управление расписанием</h3>
      <button class="modal-close" onclick="closeModal('modalSchedule')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Мастер</label>
        <select id="sch_master" onchange="renderSchedule()">
          <option value="">— Выберите мастера —</option>
        </select>
      </div>
      <div class="form-group">
        <label>Неделя начиная с</label>
        <input type="date" id="sch_week" onchange="renderSchedule()">
      </div>
      <div id="scheduleGrid" style="margin-top:1rem"></div>
      <p style="font-size:.75rem;color:var(--muted);margin-top:.75rem">
        🟣 Занято клиентом &nbsp; 🔴 Заблокировано вами &nbsp; 🟢 Свободно<br>
        Нажмите на свободный слот — заблокируете. Нажмите на заблокированный — разблокируете.
      </p>
    </div>
  </div>
</div>

<!-- ===== MODAL: Перенести запись ===== -->
<div class="modal-overlay" id="modalReschedule" onclick="handleOverlay(event,'modalReschedule')">
  <div class="modal-box">
    <div class="modal-hdr">
      <h3>🔄 Перенести запись</h3>
      <button class="modal-close" onclick="closeModal('modalReschedule')">×</button>
    </div>
    <div class="modal-body">
      <div id="rs_info" style="background:rgba(176,106,179,.08);border:1px solid rgba(176,106,179,.2);border-radius:12px;padding:1rem;margin-bottom:1.25rem;font-size:.85rem"></div>
      <div class="form-group"><label>Новая дата</label><input type="date" id="rs_date" onchange="updateRescheduleSlots()"></div>
      <div class="form-group">
        <label>Новое время</label>
        <div class="slot-grid" id="rs_slots"></div>
      </div>
      <button class="btn" style="width:100%" onclick="confirmReschedule()">✅ Перенести</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const MASTERS_DATA=[
  {id:1,name:'Анна Соколова',specialty:'Мастер маникюра',duration:150,price:'от 1500 ₽',gradient:'linear-gradient(135deg,#f093fb,#f5576c)',avatar:'АС'},
  {id:2,name:'Мария Иванова',specialty:'Бровист',duration:60,price:'от 2000 ₽',gradient:'linear-gradient(135deg,#4facfe,#00f2fe)',avatar:'МИ'},
  {id:3,name:'Елена Козлова',specialty:'Визажист',duration:90,price:'от 3000 ₽',gradient:'linear-gradient(135deg,#43e97b,#38f9d7)',avatar:'ЕК'},
  {id:4,name:'Ольга Петрова',specialty:'Мастер по волосам',duration:120,price:'от 2500 ₽',gradient:'linear-gradient(135deg,#fa709a,#fee140)',avatar:'ОП'},
  {id:5,name:'Наталья Сидорова',specialty:'Косметолог',duration:90,price:'от 3500 ₽',gradient:'linear-gradient(135deg,#a18cd1,#fbc2eb)',avatar:'НС'},
  {id:6,name:'Юлия Новикова',specialty:'Лэшмейкер',duration:90,price:'от 2200 ₽',gradient:'linear-gradient(135deg,#f7971e,#ffd200)',avatar:'ЮН'}
];

// Auth
const token=localStorage.getItem('glowToken');
const userStr=localStorage.getItem('glowUser');
if(!token||!userStr){window.location.href='/auth.html';}
const user=JSON.parse(userStr||'{}');

let rescheduleIdx=null;

// ===== HELPERS =====
function timeToMins(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
function minsToTime(m){return`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;}
function durLabel(m){const h=Math.floor(m/60),min=m%60;return min?`${h}ч ${min}мин`:`${h} ч`;}
function getToday(){return new Date().toISOString().split('T')[0];}

function getOccupied(masterId,date,excludeIdx=null){
  const apps=JSON.parse(localStorage.getItem('glowAppointments')||'[]');
  const blocked=JSON.parse(localStorage.getItem('glowMasterBlocked')||'{}');
  const out=[];
  apps.forEach((a,i)=>{
    if(i===excludeIdx)return;
    if(a.masterId!==masterId||a.date!==date||a.status==='cancelled')return;
    const m=MASTERS_DATA.find(x=>x.id===masterId);
    const dur=m?m.duration:60;
    const start=timeToMins(a.time);
    for(let t=start;t<start+dur;t+=30)out.push(minsToTime(t));
  });
  if(blocked[masterId]&&blocked[masterId][date])out.push(...blocked[masterId][date]);
  return out;
}

function buildSlots(masterId,date,excludeIdx=null){
  const m=MASTERS_DATA.find(x=>x.id===masterId);
  if(!m)return[];
  const dur=m.duration;
  const occ=getOccupied(masterId,date,excludeIdx);
  const slots=[];
  for(let s=9*60;s+dur<=20*60;s+=30){
    let busy=false;
    for(let t=s;t<s+dur;t+=30){if(occ.includes(minsToTime(t))){busy=true;break;}}
    slots.push({time:minsToTime(s),end:minsToTime(s+dur),busy});
  }
  return slots;
}

function renderSlots(containerId,masterId,date,selectedRef,excludeIdx=null){
  const slots=buildSlots(masterId,date,excludeIdx);
  const el=document.getElementById(containerId);
  if(!slots.length){el.innerHTML='<p style="color:var(--muted);font-size:.82rem">Нет доступных слотов</p>';return;}
  el.innerHTML=slots.map(s=>s.busy
    ?`<button class="slot-btn blocked" disabled title="Занято">${s.time}<span style="display:block;font-size:.62rem;opacity:.7">${s.end}</span></button>`
    :`<button class="slot-btn" onclick="pickSlot('${s.time}',this,'${selectedRef}')">${s.time}<span style="display:block;font-size:.62rem;opacity:.6">${s.end}</span></button>`
  ).join('');
}

let nbSelectedTime=null;
let rsSelectedTime=null;
function pickSlot(time,btn,ref){
  const grid=btn.closest('.slot-grid');
  grid.querySelectorAll('.slot-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(ref==='nb')nbSelectedTime=time;
  else rsSelectedTime=time;
}

// ===== SCHEDULE EDITOR =====
function renderSchedule(){
  const mid=parseInt(document.getElementById('sch_master').value);
  const weekStr=document.getElementById('sch_week').value;
  const el=document.getElementById('scheduleGrid');
  if(!mid||!weekStr){el.innerHTML='<p style="color:var(--muted);font-size:.85rem">Выберите мастера и неделю</p>';return;}
  const m=MASTERS_DATA.find(x=>x.id===mid);
  const blocked=JSON.parse(localStorage.getItem('glowMasterBlocked')||'{}');
  const apps=JSON.parse(localStorage.getItem('glowAppointments')||'[]');

  // Build 7 days
  const days=[];
  const base=new Date(weekStr);
  for(let i=0;i<7;i++){
    const d=new Date(base);d.setDate(d.getDate()+i);
    days.push(d.toISOString().split('T')[0]);
  }
  const dayNames=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

  // Build time labels 9:00-19:30 step 30min
  const times=[];
  for(let t=9*60;t<20*60;t+=30)times.push(minsToTime(t));

  el.innerHTML=`
    <div style="display:grid;grid-template-columns:auto repeat(7,1fr);gap:.35rem;font-size:.72rem">
      <div></div>
      ${days.map((d,i)=>`<div style="text-align:center;font-weight:600;color:var(--muted);padding:.2rem 0">${dayNames[i]}<br><span style="color:var(--text)">${d.slice(5)}</span></div>`).join('')}
      ${times.map(t=>`
        <div style="color:var(--muted);font-size:.68rem;padding:.25rem .4rem;display:flex;align-items:center">${t}</div>
        ${days.map(d=>{
          const isBlocked=(blocked[mid]&&blocked[mid][d]||[]).includes(t);
          const isOccupied=apps.some(a=>{
            if(a.masterId!==mid||a.date!==d||a.status==='cancelled')return false;
            const dur=m.duration;const start=timeToMins(a.time);
            return t===minsToTime(start)||
              (timeToMins(t)>start&&timeToMins(t)<start+dur);
          });
          const cls=isOccupied?'occupied':isBlocked?'blocked-admin':'free';
          const title=isOccupied?'Занято клиентом':isBlocked?'Заблокировано вами':'Свободно';
          return`<div class="day-slot ${cls}" title="${title}" onclick="toggleBlock(${mid},'${d}','${t}',this)">${isOccupied?'●':isBlocked?'✕':'·'}</div>`;
        }).join('')}
      `).join('')}
    </div>
  `;
}

function toggleBlock(mid,date,time,el){
  const apps=JSON.parse(localStorage.getItem('glowAppointments')||'[]');
  const isOccupied=apps.some(a=>a.masterId===mid&&a.date===date&&a.status!=='cancelled'&&
    (()=>{const m=MASTERS_DATA.find(x=>x.id===mid);const dur=m?m.duration:60;const s=timeToMins(a.time);return time===a.time||(timeToMins(time)>s&&timeToMins(time)<s+dur);})()
  );
  if(isOccupied){showToast('Слот занят клиентом — нельзя изменить','error');return;}

  const blocked=JSON.parse(localStorage.getItem('glowMasterBlocked')||'{}');
  if(!blocked[mid])blocked[mid]={};
  if(!blocked[mid][date])blocked[mid][date]=[];
  const idx=blocked[mid][date].indexOf(time);
  if(idx===-1){
    blocked[mid][date].push(time);
    el.className='day-slot blocked-admin';el.textContent='✕';el.title='Заблокировано вами';
    showToast(`Слот ${time} заблокирован`,'info');
  } else {
    blocked[mid][date].splice(idx,1);
    el.className='day-slot free';el.textContent='·';el.title='Свободно';
    showToast(`Слот ${time} разблокирован`);
  }
  localStorage.setItem('glowMasterBlocked',JSON.stringify(blocked));
}
