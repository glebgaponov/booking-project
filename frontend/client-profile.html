<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой профиль | GLOW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0a1e;--bg2:#1a1030;--card:#1e1535;--border:rgba(255,255,255,.08);--text:#f0eaff;--muted:rgba(240,234,255,.6);--accent:#b06ab3;--accent2:#4776e6;--radius:16px;--input-bg:rgba(255,255,255,.05)}
[data-theme="light"]{--bg:#faf8ff;--bg2:#f0ebff;--card:#fff;--border:rgba(0,0,0,.08);--text:#1a1030;--muted:rgba(26,16,48,.6);--input-bg:rgba(0,0,0,.03)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s;min-height:100vh}
.navbar{position:fixed;top:0;left:0;right:0;z-index:100;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;background:rgba(15,10,30,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-logo{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none}
.nav-links{display:flex;gap:1rem;align-items:center}
.nav-links a{color:var(--muted);text-decoration:none;font-size:.9rem;transition:color .2s}
.nav-links a:hover{color:var(--text)}
.theme-btn{background:none;border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem;transition:all .2s}
.page{padding:6rem 2rem 3rem;max-width:900px;margin:0 auto}
.profile-header{display:flex;align-items:center;gap:1.5rem;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;margin-bottom:2rem}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:700;color:#fff;flex-shrink:0}
.profile-info h1{font-size:1.5rem;font-weight:700}
.profile-info p{color:var(--muted);font-size:.9rem;margin-top:.25rem}
.role-badge{display:inline-block;padding:.25rem .75rem;background:rgba(176,106,179,.2);color:var(--accent);border-radius:20px;font-size:.75rem;font-weight:600;margin-top:.5rem}
.tabs{display:flex;gap:.5rem;margin-bottom:2rem;border-bottom:1px solid var(--border);padding-bottom:0}
.tab{padding:.75rem 1.25rem;background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;font-weight:500;font-family:'Inter',sans-serif;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none}
.tab-content.active{display:block}
.booking-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.booking-card:hover{border-color:var(--accent)}
.booking-info h3{font-size:1rem;font-weight:600;margin-bottom:.25rem}
.booking-info p{color:var(--muted);font-size:.85rem}
.booking-meta{text-align:right;flex-shrink:0}
.booking-date{font-size:.9rem;font-weight:500}
.booking-status{display:inline-block;padding:.2rem .75rem;border-radius:20px;font-size:.75rem;font-weight:600;margin-top:.25rem}
.status-confirmed{background:rgba(67,233,123,.15);color:#43e97b}
.status-cancelled{background:rgba(245,87,108,.15);color:#f5576c}
.cancel-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:.4rem .85rem;border-radius:8px;cursor:pointer;font-size:.8rem;margin-top:.5rem;transition:all .2s;font-family:'Inter',sans-serif}
.cancel-btn:hover{border-color:#f5576c;color:#f5576c}
.fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem}
.fav-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;text-align:center;cursor:pointer;transition:all .3s}
.fav-card:hover{border-color:var(--accent);transform:translateY(-3px)}
.fav-avatar{width:56px;height:56px;border-radius:50%;margin:0 auto .75rem;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;color:#fff}
.fav-card h3{font-size:.95rem;font-weight:600;margin-bottom:.25rem}
.fav-card p{color:var(--accent);font-size:.8rem}
.settings-form{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:2rem}
.form-group{margin-bottom:1.25rem}
label{display:block;font-size:.85rem;font-weight:500;margin-bottom:.5rem;color:var(--text);opacity:.8}
input,select{width:100%;padding:.85rem 1rem;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.95rem;font-family:'Inter',sans-serif;transition:border-color .2s;outline:none}
input:focus{border-color:var(--accent)}
.btn{padding:.85rem 2rem;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:12px;font-size:.95rem;font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s;font-family:'Inter',sans-serif}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(176,106,179,.4)}
.logout-btn{background:none;border:1px solid rgba(245,87,108,.3);color:#f5576c;padding:.6rem 1.25rem;border-radius:10px;cursor:pointer;font-size:.85rem;font-family:'Inter',sans-serif;transition:all .2s}
.logout-btn:hover{background:rgba(245,87,108,.1)}
.empty-state{text-align:center;padding:4rem 2rem;color:var(--muted)}
.empty-state .icon{font-size:3rem;margin-bottom:1rem}
.toast{position:fixed;top:2rem;right:2rem;padding:1rem 1.5rem;border-radius:12px;font-size:.9rem;font-weight:500;z-index:9999;transform:translateX(120%);transition:transform .3s}
.toast.show{transform:translateX(0)}
.toast.success{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#0a2e1a}
.toast.error{background:linear-gradient(135deg,#f5576c,#f093fb);color:#fff}
@media(max-width:600px){.booking-card{flex-direction:column;align-items:flex-start}.booking-meta{text-align:left}.profile-header{flex-direction:column;text-align:center}.nav-links a:not(.btn-nav){display:none}}
</style>
</head>
<body>
<nav class="navbar">
  <a href="/" class="nav-logo">✨ GLOW</a>
  <div class="nav-links">
    <a href="/">Главная</a>
    <button class="logout-btn" onclick="logout()">Выйти</button>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
</nav>

<div class="page">
  <div class="profile-header">
    <div class="avatar" id="userAvatar">?</div>
    <div class="profile-info">
      <h1 id="userName">Загрузка...</h1>
      <p id="userEmail">—</p>
      <div class="role-badge" id="userRole">клиент</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('bookings')">📅 Записи</button>
    <button class="tab" onclick="showTab('favorites')">❤️ Избранное</button>
    <button class="tab" onclick="showTab('settings')">⚙️ Настройки</button>
  </div>

  <div id="bookings" class="tab-content active">
    <div id="bookingsList"><div class="empty-state"><div class="icon">📅</div><p>Загрузка...</p></div></div>
  </div>

  <div id="favorites" class="tab-content">
    <div id="favList" class="fav-grid"></div>
  </div>

  <div id="settings" class="tab-content">
    <div class="settings-form">
      <h2 style="margin-bottom:1.5rem;font-size:1.2rem">Настройки профиля</h2>
      <div class="form-group"><label>Имя</label><input type="text" id="settingName" placeholder="Ваше имя"></div>
      <div class="form-group"><label>Email</label><input type="email" id="settingEmail" placeholder="Email" disabled style="opacity:.6"></div>
      <div style="display:flex;gap:1rem;flex-wrap:wrap">
        <button class="btn" onclick="saveSettings()">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Auth check
const token=localStorage.getItem('glowToken');
const userStr=localStorage.getItem('glowUser');
if(!token||!userStr){window.location.href='/auth.html';}
const user=JSON.parse(userStr||'{}');

// Init
document.getElementById('userName').textContent=user.name||'Пользователь';
document.getElementById('userEmail').textContent=user.email||'';
document.getElementById('userRole').textContent=user.role==='admin'?'👑 Администратор':user.role==='master'?'💅 Мастер':'👤 Клиент';
const initials=(user.name||'U').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
document.getElementById('userAvatar').textContent=initials;
document.getElementById('settingName').value=user.name||'';
document.getElementById('settingEmail').value=user.email||'';

function showTab(id){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}

function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className=`toast ${type}`;
  setTimeout(()=>t.classList.add('show'),10);
  setTimeout(()=>t.classList.remove('show'),3500);
}

// Load bookings
function loadBookings(){
  const stored=JSON.parse(localStorage.getItem('glowAppointments')||'[]');
  const container=document.getElementById('bookingsList');
  if(!stored.length){
    container.innerHTML='<div class="empty-state"><div class="icon">📅</div><p>У вас пока нет записей.<br>Найдите мастера на главной!</p></div>';
    return;
  }
  container.innerHTML=stored.map((a,i)=>`
    <div class="booking-card" id="booking-${i}">
      <div class="booking-info">
        <h3>${a.masterName||'Мастер'}</h3>
        <p>${a.service||'Услуга'} • ${a.payMethod==='card'?'💳 Карта':a.payMethod==='sbp'?'📱 СБП':'💵 Наличные'}</p>
        ${a.comment?`<p style="margin-top:.25rem;opacity:.6;font-size:.8rem">${a.comment}</p>`:''}
      </div>
      <div class="booking-meta">
        <div class="booking-date">${a.date} в ${a.time}</div>
        <div class="booking-status ${a.status==='confirmed'?'status-confirmed':'status-cancelled'}">${a.status==='confirmed'?'✅ Подтверждено':'❌ Отменено'}</div>
        ${a.status==='confirmed'?`<br><button class="cancel-btn" onclick="cancelBooking(${i})">Отменить</button>`:''}
      </div>
    </div>
  `).join('');
}

function cancelBooking(i){
  const stored=JSON.parse(localStorage.getItem('glowAppointments')||'[]');
  stored[i].status='cancelled';
  localStorage.setItem('glowAppointments',JSON.stringify(stored));
  loadBookings();
  showToast('Запись отменена');
}

// Load favorites
function loadFavorites(){
  const favs=JSON.parse(localStorage.getItem('glowFavorites')||'[]');
  const masters=[
    {id:1,name:'Анна Соколова',specialty:'Мастер маникюра',gradient:'linear-gradient(135deg,#f093fb,#f5576c)',avatar:'АС'},
    {id:2,name:'Мария Иванова',specialty:'Бровист',gradient:'linear-gradient(135deg,#4facfe,#00f2fe)',avatar:'МИ'},
    {id:3,name:'Елена Козлова',specialty:'Визажист',gradient:'linear-gradient(135deg,#43e97b,#38f9d7)',avatar:'ЕК'},
    {id:4,name:'Ольга Петрова',specialty:'Мастер по волосам',gradient:'linear-gradient(135deg,#fa709a,#fee140)',avatar:'ОП'},
    {id:5,name:'Наталья Сидорова',specialty:'Косметолог',gradient:'linear-gradient(135deg,#a18cd1,#fbc2eb)',avatar:'НС'},
    {id:6,name:'Юлия Новикова',specialty:'Лэшмейкер',gradient:'linear-gradient(135deg,#f7971e,#ffd200)',avatar:'ЮН'}
  ];
  const favMasters=masters.filter(m=>favs.includes(m.id));
  const container=document.getElementById('favList');
  if(!favMasters.length){
    container.innerHTML='<div class="empty-state" style="grid-column:1/-1"><div class="icon">❤️</div><p>Нет избранных мастеров.<br>Добавляйте мастеров на главной!</p></div>';
    return;
  }
  container.innerHTML=favMasters.map(m=>`
    <div class="fav-card" onclick="window.location.href='/'">
      <div class="fav-avatar" style="background:${m.gradient}">${m.avatar}</div>
      <h3>${m.name}</h3>
      <p>${m.specialty}</p>
    </div>
  `).join('');
}

function saveSettings(){
  const name=document.getElementById('settingName').value.trim();
  if(!name){showToast('Введите имя','error');return;}
  user.name=name;
  localStorage.setItem('glowUser',JSON.stringify(user));
  document.getElementById('userName').textContent=name;
  const initials=name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  document.getElementById('userAvatar').textContent=initials;
  showToast('✅ Настройки сохранены');
}

function logout(){
  localStorage.removeItem('glowToken');
  localStorage.removeItem('glowUser');
  window.location.href='/';
}

function toggleTheme(){
  const html=document.documentElement;
  const isDark=html.dataset.theme==='dark';
  html.dataset.theme=isDark?'light':'dark';
  document.getElementById('themeBtn').textContent=isDark?'☀️':'🌙';
  localStorage.setItem('theme',html.dataset.theme);
}
const savedTheme=localStorage.getItem('theme');
if(savedTheme){document.documentElement.dataset.theme=savedTheme;document.getElementById('themeBtn').textContent=savedTheme==='dark'?'🌙':'☀️';}

loadBookings();
loadFavorites();
</script>
</body>
</html>
