<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOW | Личный кабинет</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#faf6f5;--bg2:#fff;--text:#1a1a2e;--text2:#6b6b8a;--border:#f0e0e8;--accent:#c77d9e;--accent2:#a85a7a;--gradient:linear-gradient(135deg,#2d1b4e 0%,#4a2c6d 50%,#c77d9e 100%);}
        [data-theme="dark"]{--bg:#0f0a1a;--bg2:#1a122e;--text:#f0eaf6;--text2:#a89cc0;--border:#2d2044;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}
        .header{background:var(--gradient);color:white;padding:18px 0;}
        .container{max-width:1000px;margin:0 auto;padding:0 24px;}
        .header-content{display:flex;justify-content:space-between;align-items:center;}
        .logo{font-size:22px;font-weight:800;color:white;text-decoration:none;}
        .btn-sm{padding:8px 18px;border-radius:40px;border:1px solid rgba(255,255,255,0.4);background:transparent;color:white;cursor:pointer;font-size:13px;}
        .profile-hero{background:var(--gradient);color:white;padding:40px 0 60px;}
        .profile-avatar{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:12px;border:3px solid rgba(255,255,255,0.4);}
        .profile-name{font-size:24px;font-weight:800;margin-bottom:4px;}
        .profile-email{opacity:0.8;font-size:15px;}
        .content{margin-top:-30px;padding-bottom:60px;}
        .tabs{display:flex;gap:0;background:var(--bg2);border-radius:16px;padding:6px;margin-bottom:28px;border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.06);}
        .tab{flex:1;padding:10px;border-radius:12px;cursor:pointer;text-align:center;font-size:14px;font-weight:600;color:var(--text2);background:none;border:none;transition:all 0.2s;}
        .tab.active{background:var(--gradient);color:white;}
        .tab-content{display:none;}
        .tab-content.active{display:block;}
        .booking-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
        .booking-main{flex:1;}
        .booking-master{font-weight:700;font-size:16px;margin-bottom:4px;}
        .booking-time{font-size:14px;color:var(--text2);}
        .booking-price{font-weight:700;color:var(--accent2);font-size:15px;}
        .status-badge{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;}
        .status-pending{background:#fef9c3;color:#854d0e;}
        .status-confirmed{background:#dcfce7;color:#166534;}
        .status-cancelled{background:#fee2e2;color:#991b1b;}
        .status-completed{background:#dbeafe;color:#1e40af;}
        .cancel-btn{padding:8px 16px;border:1px solid var(--border);border-radius:40px;background:none;color:var(--text2);cursor:pointer;font-size:13px;transition:all 0.2s;}
        .cancel-btn:hover{border-color:#dc2626;color:#dc2626;}
        .empty-state{text-align:center;padding:60px 20px;color:var(--text2);}
        .empty-state p:first-child{font-size:48px;margin-bottom:12px;}
        .fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
        .fav-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:20px;text-align:center;}
        .fav-name{font-weight:700;margin-bottom:4px;}
        .fav-spec{font-size:13px;color:var(--text2);margin-bottom:10px;}
        .btn-primary{display:inline-block;background:var(--gradient);border:none;color:white;padding:10px 20px;border-radius:40px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;}
        .form-group{margin-bottom:16px;}
        .form-group label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;}
        .form-control{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font-size:15px;outline:none;font-family:inherit;}
        .form-control:focus{border-color:var(--accent);}
        .toast{position:fixed;bottom:24px;right:24px;background:#166534;color:white;padding:12px 24px;border-radius:40px;z-index:1000;font-size:14px;}
    </style>
</head>
<body>
<header class="header">
    <div class="container">
        <div class="header-content">
            <a href="/" class="logo">✨ GLOW</a>
            <div style="display:flex;gap:10px;">
                <a href="/" class="btn-sm">Мастера</a>
                <button class="btn-sm" onclick="logout()">Выйти</button>
            </div>
        </div>
    </div>
</header>

<div class="profile-hero">
    <div class="container">
        <div class="profile-avatar" id="profileAvatar">👤</div>
        <div class="profile-name" id="profileName">Загрузка...</div>
        <div class="profile-email" id="profileEmail"></div>
    </div>
</div>

<div class="content">
    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('bookings')">📅 Записи</button>
            <button class="tab" onclick="switchTab('favorites')">❤️ Избранное</button>
            <button class="tab" onclick="switchTab('settings')">⚙️ Профиль</button>
        </div>

        <!-- BOOKINGS -->
        <div class="tab-content active" id="bookingsTab">
            <div id="bookingsList"></div>
        </div>

        <!-- FAVORITES -->
        <div class="tab-content" id="favoritesTab">
            <div class="fav-grid" id="favoritesList"></div>
        </div>

        <!-- SETTINGS -->
        <div class="tab-content" id="settingsTab">
            <div style="background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:28px;max-width:480px;">
                <h3 style="margin-bottom:20px;font-size:18px;">Личные данные</h3>
                <div class="form-group"><label>Имя</label><input type="text" id="settingName" class="form-control"></div>
                <div class="form-group"><label>Email</label><input type="email" id="settingEmail" class="form-control" readonly style="opacity:0.6;"></div>
                <div class="form-group"><label>Телефон</label><input type="tel" id="settingPhone" class="form-control"></div>
                <button class="btn-primary" onclick="saveSettings()">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
    const t = localStorage.getItem('glow_theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
})();

let currentUser = null;
try { currentUser = JSON.parse(localStorage.getItem('glow_user')); } catch(e){}

if (!currentUser) { window.location.href = '/auth.html'; }

const masterData = [
    {id:1,name:"Анна Соловьёва",specialization:"Свадебный визаж"},
    {id:2,name:"Елена Морозова",specialization:"Нейл-дизайн"},
    {id:3,name:"Мария Волкова",specialization:"Архитектура бровей"},
    {id:4,name:"Ольга Новикова",specialization:"Стилист"},
    {id:5,name:"Татьяна Белова",specialization:"Вечерний образ"},
    {id:6,name:"Ирина Соколова",specialization:"Косметолог"},
];

function init() {
    if (!currentUser) return;
    document.getElementById('profileName').textContent = currentUser.fullName || 'Клиент';
    document.getElementById('profileEmail').textContent = currentUser.email || '';
    document.getElementById('profileAvatar').textContent = (currentUser.fullName || 'К')[0].toUpperCase();
    document.getElementById('settingName').value = currentUser.fullName || '';
    document.getElementById('settingEmail').value = currentUser.email || '';
    document.getElementById('settingPhone').value = currentUser.phone || '';
    renderBookings();
    renderFavorites();
}

function switchTab(name) {
    document.querySelectorAll('.tab').forEach((t,i) => {
        const tabs = ['bookings','favorites','settings'];
        t.classList.toggle('active', tabs[i] === name);
    });
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(name + 'Tab').classList.add('active');
}

function renderBookings() {
    const appointments = JSON.parse(localStorage.getItem('glow_appointments') || '[]');
    const myBookings = appointments.filter(a => a.clientId === currentUser.id);
    const container = document.getElementById('bookingsList');

    if (myBookings.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>📅</p><p style="font-size:18px;font-weight:600;margin-bottom:8px;">Записей пока нет</p><p style="font-size:14px;">Найдите своего мастера на главной</p><br><a href="/" class="btn-primary" style="margin-top:16px;">Найти мастера</a></div>`;
        return;
    }

    const statusMap = { pending:'pending', confirmed:'confirmed', cancelled:'cancelled', completed:'completed' };
    const statusLabel = { pending:'Ожидает', confirmed:'Подтверждена', cancelled:'Отменена', completed:'Завершена' };

    container.innerHTML = myBookings.reverse().map(b => `
        <div class="booking-card">
            <div class="booking-main">
                <div class="booking-master">${b.masterName}</div>
                <div class="booking-time">📅 ${formatDate(b.date)} в ${b.time}</div>
                ${b.comment ? `<div style="font-size:13px;color:var(--text2);margin-top:4px;">💬 ${b.comment}</div>` : ''}
            </div>
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                <div class="booking-price">${b.totalCost ? b.totalCost.toLocaleString('ru') + ' ₽' : ''}</div>
                <span class="status-badge status-${statusMap[b.status] || 'pending'}">${statusLabel[b.status] || b.status}</span>
                ${b.status === 'pending' || b.status === 'confirmed' ? `<button class="cancel-btn" onclick="cancelBooking(${b.id})">Отменить</button>` : ''}
            </div>
        </div>
    `).join('');
}

function cancelBooking(id) {
    if (!confirm('Отменить запись?')) return;
    const appointments = JSON.parse(localStorage.getItem('glow_appointments') || '[]');
    const idx = appointments.findIndex(a => a.id === id);
    if (idx >= 0) {
        appointments[idx].status = 'cancelled';
        localStorage.setItem('glow_appointments', JSON.stringify(appointments));
        renderBookings();
        showToast('Запись отменена');
    }
}

function renderFavorites() {
    const favIds = JSON.parse(localStorage.getItem('glow_favorites') || '[]');
    const container = document.getElementById('favoritesList');
    if (favIds.length === 0) {
        container.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><p>❤️</p><p style="font-size:18px;font-weight:600;">Избранное пусто</p><p style="font-size:14px;margin-top:8px;">Нажмите на ❤️ на карточке мастера</p></div>`;
        return;
    }
    const favMasters = masterData.filter(m => favIds.includes(m.id));
    container.innerHTML = favMasters.map(m => `
        <div class="fav-card">
            <div class="fav-name">${m.name}</div>
            <div class="fav-spec">${m.specialization}</div>
            <a href="/?master=${m.id}" class="btn-primary" style="font-size:13px;padding:8px 16px;">Записаться</a>
        </div>
    `).join('');
}

function saveSettings() {
    currentUser.fullName = document.getElementById('settingName').value.trim();
    currentUser.phone = document.getElementById('settingPhone').value.trim();
    localStorage.setItem('glow_user', JSON.stringify(currentUser));
    document.getElementById('profileName').textContent = currentUser.fullName;
    showToast('Сохранено ✅');
}

function formatDate(dateStr) {
    if (!dateStr) return '';
    try {
        return new Date(dateStr).toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'});
    } catch { return dateStr; }
}

function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

function logout() {
    localStorage.removeItem('glow_user');
    localStorage.removeItem('glow_token');
    window.location.href = '/';
}

init();
</script>
</body>
</html>
