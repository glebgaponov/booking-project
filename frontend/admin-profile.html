<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOW | Админ-панель</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #faf6f5; }
        .header { background: linear-gradient(135deg, #2d1b4e 0%, #4a2c6d 50%, #c77d9e 100%); color: white; padding: 20px 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 28px; font-weight: 700; color: white; text-decoration: none; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-link { color: white; text-decoration: none; }
        .admin-container { max-width: 1000px; margin: 40px auto; background: white; border-radius: 32px; overflow: hidden; }
        .stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; padding: 24px; }
        .stat-card { background: #faf6f5; padding: 20px; border-radius: 20px; text-align: center; }
        .section { padding: 24px; border-top: 1px solid #f0e0e5; }
        .user-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #faf6f5; margin-bottom: 8px; border-radius: 16px; }
        .export-buttons { display: flex; gap: 12px; margin-bottom: 20px; }
        .btn { padding: 10px 20px; border-radius: 40px; border: none; cursor: pointer; font-weight: 600; }
        .btn-export { background: #22c55e; color: white; }
        .btn-import { background: #3b82f6; color: white; }
        .btn-delete { background: #fee2e2; color: #dc2626; }
        .promo-card { background: #faf6f5; padding: 16px; border-radius: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; }
        @media (max-width: 768px) { .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<header class="header"><div class="container"><div class="header-content"><a href="/" class="logo">GLOW</a><div class="nav-links"><a href="/" class="nav-link">Главная</a><button onclick="logout()" style="background:rgba(255,255,255,0.2); border:none; padding:6px 16px; border-radius:40px; color:white">Выйти</button></div></div></div></header>
<div class="admin-container"><div class="stats-grid" id="stats"></div><div class="section"><h3>📤 Импорт / Экспорт данных</h3><div class="export-buttons"><button class="btn btn-export" onclick="exportData()">Экспорт JSON</button><button class="btn btn-import" onclick="importData()">Импорт JSON</button></div></div><div class="section"><h3>👥 Пользователи</h3><div id="usersList"></div></div><div class="section"><h3>🏷️ Промокоды</h3><div id="promoCodesList"></div><button class="btn" onclick="addPromoCode()" style="background:#22c55e; color:white">+ Добавить промокод</button></div></div>
<script>
    let currentUser = JSON.parse(localStorage.getItem('glow_current_user'));
    if (!currentUser || currentUser.role !== 'admin') window.location.href = '/';
    function loadStats() { let users = JSON.parse(localStorage.getItem('glow_users')) || []; let masters = JSON.parse(localStorage.getItem('glow_masters')) || []; let appointments = JSON.parse(localStorage.getItem('glow_appointments')) || []; document.getElementById('stats').innerHTML = `<div class="stat-card"><h3>${users.length}</h3><p>Пользователей</p></div><div class="stat-card"><h3>${masters.length}</h3><p>Мастеров</p></div><div class="stat-card"><h3>${appointments.length}</h3><p>Заявок</p></div>`; }
    function loadUsers() { let users = JSON.parse(localStorage.getItem('glow_users')) || []; document.getElementById('usersList').innerHTML = users.map(u => `<div class="user-item"><span><strong>${u.email}</strong> (${u.role})</span><button class="btn-delete" onclick="deleteUser(${u.id})" style="padding:6px 12px">Удалить</button></div>`).join(''); }
    function deleteUser(id) { let users = JSON.parse(localStorage.getItem('glow_users')) || []; users = users.filter(u => u.id !== id); localStorage.setItem('glow_users', JSON.stringify(users)); loadUsers(); loadStats(); }
    function loadPromoCodes() { let promoCodes = JSON.parse(localStorage.getItem('glow_promocodes')) || []; document.getElementById('promoCodesList').innerHTML = promoCodes.map(p => `<div class="promo-card"><span><strong>${p.code}</strong> - ${p.discount}% скидка<br><small>Использован: ${p.usedBy.length} раз</small></span><button onclick="deletePromoCode('${p.code}')" style="background:#fee2e2; border:none; padding:6px 12px; border-radius:20px">🗑️</button></div>`).join(''); }
    function addPromoCode() { let code = prompt('Введите код промокода (например: SUMMER30)'); let discount = parseInt(prompt('Скидка в % (1-100)')); if(code && discount) { let promoCodes = JSON.parse(localStorage.getItem('glow_promocodes')) || []; promoCodes.push({ code: code.toUpperCase(), discount, usedBy: [] }); localStorage.setItem('glow_promocodes', JSON.stringify(promoCodes)); loadPromoCodes(); } }
    function deletePromoCode(code) { let promoCodes = JSON.parse(localStorage.getItem('glow_promocodes')) || []; promoCodes = promoCodes.filter(p => p.code !== code); localStorage.setItem('glow_promocodes', JSON.stringify(promoCodes)); loadPromoCodes(); }
    function exportData() { let data = { users: JSON.parse(localStorage.getItem('glow_users')), masters: JSON.parse(localStorage.getItem('glow_masters')), appointments: JSON.parse(localStorage.getItem('glow_appointments')), messages: JSON.parse(localStorage.getItem('glow_messages')), reviews: JSON.parse(localStorage.getItem('glow_reviews')), promoCodes: JSON.parse(localStorage.getItem('glow_promocodes')) }; let blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'}); let url = URL.createObjectURL(blob); let a = document.createElement('a'); a.href = url; a.download = `glow_backup_${new Date().toISOString().slice(0,19)}.json`; a.click(); alert('Данные экспортированы'); }
    function importData() { let input = document.createElement('input'); input.type = 'file'; input.accept = 'application/json'; input.onchange = e => { let file = e.target.files[0]; let reader = new FileReader(); reader.onload = ev => { let data = JSON.parse(ev.target.result); if(data.users) localStorage.setItem('glow_users', JSON.stringify(data.users)); if(data.masters) localStorage.setItem('glow_masters', JSON.stringify(data.masters)); if(data.appointments) localStorage.setItem('glow_appointments', JSON.stringify(data.appointments)); if(data.messages) localStorage.setItem('glow_messages', JSON.stringify(data.messages)); if(data.reviews) localStorage.setItem('glow_reviews', JSON.stringify(data.reviews)); if(data.promoCodes) localStorage.setItem('glow_promocodes', JSON.stringify(data.promoCodes)); alert('Данные импортированы! Страница будет перезагружена'); setTimeout(() => location.reload(), 1500); }; reader.readAsText(file); }; input.click(); }
    function logout() { localStorage.removeItem('glow_current_user'); window.location.href = '/'; }
    loadStats(); loadUsers(); loadPromoCodes();
</script>
</body>
</html>
